
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">

<title>FaceCrato</title>

<link rel="manifest" href="./manifest.json">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1120;
    color: #f8fafc;
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
    padding: 30px;
    width: 100%;
    max-width: 400px;
}

.logo {
    width: 65px;
    height: 65px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 19px;
    background: linear-gradient(135deg, #2563eb, #6366f1);
    font-size: 30px;
    font-weight: 900;
}

h1 {
    font-size: 29px;
    margin: 0 0 10px;
    font-weight: 900;
    letter-spacing: -1px;
}

p {
    color: #94a3b8;
    font-size: 14px;
}

.loader {
    width: 30px;
    height: 30px;
    margin: 28px auto;
    border: 3px solid #26354d;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.error {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    background: #7f1d1d33;
    border: 1px solid #991b1b66;
    color: #fca5a5;
    font-size: 13px;
    line-height: 1.5;
}

button {
    display: none;
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">F</div>

    <h1>FaceCrato</h1>

    <p id="status">Preparando sua conexão...</p>

    <div class="loader" id="loader"></div>

    <div class="error" id="error"></div>

    <button id="retryButton" onclick="location.reload()">
        Tentar novamente
    </button>

</div>

<script type="module">

import { supabase } from "./supabase.js";

const status = document.getElementById("status");
const loader = document.getElementById("loader");
const errorBox = document.getElementById("error");
const retryButton = document.getElementById("retryButton");

let direcionando = false;

function mostrarErro(mensagem) {

    loader.style.display = "none";
    status.textContent = "Não foi possível continuar.";
    errorBox.textContent = mensagem;
    errorBox.style.display = "block";
    retryButton.style.display = "block";

}

async function iniciar() {

    try {

        status.textContent = "Verificando sua sessão...";

        const { data, error } = await supabase.auth.getSession();

        if (error) throw error;

        const destino = data.session
            ? "./feed.html"
            : "./login.html";

        direcionando = true;

        status.textContent = data.session
            ? "Bem-vindo de volta!"
            : "Vamos começar...";

        window.location.replace(destino);

    } catch (error) {

        console.error("Erro de inicialização:", error);

        mostrarErro(
            "Verifique sua conexão com a internet e tente novamente. " +
            (error.message || "")
        );

    }

}

iniciar();

// Mantém a sessão sincronizada caso ela mude em outra aba.
supabase.auth.onAuthStateChange((event, session) => {

    if (direcionando) return;

    if (event === "SIGNED_IN") {
        direcionando = true;
        window.location.replace("./feed.html");
    }

    if (event === "SIGNED_OUT") {
        direcionando = true;
        window.location.replace("./login.html");
    }

});

</script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
            .catch(error => console.error("Erro PWA:", error));
    });
}
</script>

</body>
</html>
