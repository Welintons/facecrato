<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Amigos | FaceCrato</title>

<link rel="manifest" href="./manifest.json">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-gray-50 text-slate-900 font-sans antialiased min-h-screen">

<!-- TOPO -->
<header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-7xl h-[72px] mx-auto px-6 flex items-center gap-4 sm:gap-6">
        <!-- LOGO / BOTÃO HOME -->
        <a href="./feed.html" class="flex items-center gap-3 text-2xl font-black tracking-tight text-slate-900 group cursor-pointer" title="Início">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-violet-600 text-white flex items-center justify-center shadow-md shadow-cyan-500/20 group-hover:scale-105 transition">
                <i data-lucide="home" class="w-5 h-5"></i>
            </div>
            FaceCrato
        </a>

        <div class="flex-1 max-w-md relative hidden sm:block">
            <i data-lucide="search" class="absolute left-4 top-3.5 w-4 h-4 text-gray-400"></i>
            <input type="search" placeholder="Pesquisar no FaceCrato..." disabled class="w-full h-11 pl-11 pr-4 bg-gray-100 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-cyan-600 focus:bg-white transition">
        </div>

        <div class="ml-auto flex items-center gap-2.5">
            <button class="w-10 h-10 bg-white border border-gray-200 rounded-xl text-gray-600 flex items-center justify-center hover:bg-gray-100 hover:text-slate-900 transition" onclick="location.href='./notificacoes.html'" title="Notificações"><i data-lucide="bell" class="w-5 h-5"></i></button>
            <button class="w-10 h-10 bg-white border border-gray-200 rounded-xl text-gray-600 flex items-center justify-center hover:bg-gray-100 hover:text-slate-900 transition" id="profileButton" title="Meu perfil"><i data-lucide="user-round" class="w-5 h-5"></i></button>

            <!-- BOTÃO SANDUÍCHE (Mobile) -->
            <button class="w-10 h-10 bg-white border border-gray-200 rounded-xl text-gray-600 flex items-center justify-center hover:bg-gray-100 hover:text-slate-900 transition lg:hidden" id="menuToggleBtn" title="Menu"><i data-lucide="menu" class="w-5 h-5"></i></button>
        </div>
    </div>
</header>

<!-- LAYOUT PRINCIPAL -->
<main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-[260px_minmax(0,1fr)_280px] gap-7 items-start relative">

    <!-- SIDEBAR ESQUERDA -->
    <aside class="sticky top-24 bg-white border border-gray-200 rounded-2xl p-5 shadow-sm hidden lg:block">
        <div class="flex items-center gap-3.5 pb-5 border-b border-gray-100 mb-4">
            <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-cyan-600 to-violet-600 text-white font-black flex items-center justify-center overflow-hidden relative shadow-sm" id="sideAvatar">F</div>
            <div class="min-w-0">
                <strong id="sideName" class="block text-sm font-bold text-slate-900 truncate">Carregando...</strong>
                <small id="sideUsername" class="text-xs text-gray-500 truncate">@...</small>
            </div>
        </div>

        <div class="mt-4 p-4 rounded-xl bg-gray-50 border border-gray-200 text-xs text-gray-500 leading-relaxed">
            <strong class="text-slate-800">FACECRATO</strong><br>
            Conectando pessoas em alto estilo.
        </div>
    </aside>

    <!-- CONTEÚDO CENTRAL (Amigos) -->
    <section class="min-w-0">
        <div class="mb-6">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Amigos</h1>
            <p class="text-xs text-gray-500 mt-0.5">Encontre pessoas e gerencie suas amizades.</p>
        </div>

        <!-- PESQUISA -->
        <div class="bg-white border border-gray-200 rounded-2xl p-4 mb-6 shadow-sm flex items-center gap-3">
            <i data-lucide="search" class="w-4 h-4 text-gray-400 shrink-0"></i>
            <input type="search" id="searchInput" placeholder="Pesquisar pessoas pelo nome ou @username..." autocomplete="off" class="w-full bg-transparent border-0 outline-none text-xs text-slate-900 placeholder:text-gray-400">
        </div>

        <!-- RESULTADOS DA PESQUISA -->
        <section class="search-results mb-6" id="searchResults"></section>

        <!-- ABAS -->
        <div class="grid grid-cols-3 gap-2 mb-6">
            <button class="tab-btn rounded-xl p-3 bg-white border border-gray-200 shadow-sm text-xs font-bold text-cyan-700 bg-cyan-50 border-cyan-200 flex items-center justify-center gap-2" data-tab="friends">
                <i data-lucide="users" class="w-4 h-4"></i> Meus amigos <span class="px-2 py-0.5 rounded-full bg-cyan-100 text-cyan-800 text-[10px]" id="friendsCount">0</span>
            </button>
            <button class="tab-btn rounded-xl p-3 bg-white border border-gray-200 shadow-sm text-xs font-semibold text-gray-500 hover:text-slate-900 flex items-center justify-center gap-2" data-tab="received">
                <i data-lucide="user-plus" class="w-4 h-4"></i> Recebidas <span class="px-2 py-0.5 rounded-full bg-gray-100 text-gray-700 text-[10px]" id="receivedCount">0</span>
            </button>
            <button class="tab-btn rounded-xl p-3 bg-white border border-gray-200 shadow-sm text-xs font-semibold text-gray-500 hover:text-slate-900 flex items-center justify-center gap-2" data-tab="sent">
                <i data-lucide="send" class="w-4 h-4"></i> Enviadas <span class="px-2 py-0.5 rounded-full bg-gray-100 text-gray-700 text-[10px]" id="sentCount">0</span>
            </button>
        </div>

        <!-- CONTEÚDO -->
        <div id="content" class="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm">
            <div class="p-12 text-center text-gray-400 text-xs">
                Carregando amizades...
            </div>
        </div>
    </section>

    <!-- SIDEBAR DIREITA (Navegação & Logout) -->
    <aside class="sticky top-24 bg-white border border-gray-200 rounded-2xl p-5 shadow-sm hidden lg:block">
        <h3 class="text-sm font-extrabold text-slate-900 mb-3">Navegação</h3>
        <nav class="space-y-1 mb-5">
            <button class="w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-slate-900 font-semibold text-sm transition" data-nav="feed"><i data-lucide="house" class="w-4 h-4"></i> Feed</button>
            <button class="w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl bg-cyan-50 text-cyan-700 font-bold text-sm border border-cyan-200" data-nav="friends"><i data-lucide="users" class="w-4 h-4"></i> Amigos</button>
            <button class="w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-slate-900 font-semibold text-sm transition" data-nav="notifications"><i data-lucide="bell" class="w-4 h-4"></i> Notificações</button>
            <button class="w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-slate-900 font-semibold text-sm transition" data-nav="profile"><i data-lucide="user-round" class="w-4 h-4"></i> Meu perfil</button>
        </nav>

        <div class="h-px bg-gray-100 my-4"></div>

        <h3 class="text-sm font-extrabold text-slate-900 mb-3">Sessão</h3>
        <button class="w-full flex items-center gap-3.5 px-4 py-2.5 rounded-xl text-red-600 hover:bg-red-50 font-semibold text-sm transition" id="logoutButton"><i data-lucide="log-out" class="w-4 h-4"></i> Sair da conta</button>

        <div class="h-px bg-gray-100 my-4"></div>
        <p class="text-[11px] text-gray-400">FaceCrato © 2026</p>
    </aside>

</main>

<!-- MENU MOBILE DESLIZANTE -->
<div id="mobileMenuOverlay" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden lg:hidden transition-opacity"></div>
<div id="mobileMenuDrawer" class="fixed top-0 right-0 bottom-0 w-72 bg-white border-l border-gray-200 p-6 z-50 shadow-2xl transform translate-x-full transition-transform duration-300 lg:hidden flex flex-col">
    <div class="flex items-center justify-between pb-4 border-b border-gray-100 mb-6">
        <h3 class="text-base font-black text-slate-900">Menu</h3>
        <button class="w-9 h-9 bg-gray-100 rounded-xl text-gray-600 flex items-center justify-center hover:bg-gray-200 transition" id="menuCloseBtn"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>

    <h3 class="text-xs font-extrabold text-gray-400 uppercase tracking-wider mb-3">Navegação</h3>
    <nav class="space-y-1.5 mb-6">
        <button class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-slate-900 font-semibold text-sm transition" data-nav="feed"><i data-lucide="house" class="w-5 h-5"></i> Feed</button>
        <button class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl bg-cyan-50 text-cyan-700 font-bold text-sm border border-cyan-200" data-nav="friends"><i data-lucide="users" class="w-5 h-5"></i> Amigos</button>
        <button class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-slate-900 font-semibold text-sm transition" data-nav="notifications"><i data-lucide="bell" class="w-5 h-5"></i> Notificações</button>
        <button class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-slate-900 font-semibold text-sm transition" data-nav="profile"><i data-lucide="user-round" class="w-5 h-5"></i> Meu perfil</button>
    </nav>

    <div class="mt-auto pt-4 border-t border-gray-100">
        <button class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-red-600 bg-red-50 font-semibold text-sm transition" id="logoutButtonMobile"><i data-lucide="log-out" class="w-5 h-5"></i> Sair da conta</button>
    </div>
</div>

<script type="module">
import { supabase } from "./supabase.js";

let currentUser = null;
let currentProfile = null;
let friendships = [];
let profiles = {};
let activeTab = "friends";
let searchTimer = null;

const content = document.getElementById("content");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

// Controle do Menu Sanduíche Mobile
const menuToggleBtn = document.getElementById("menuToggleBtn");
const menuCloseBtn = document.getElementById("menuCloseBtn");
const mobileMenuDrawer = document.getElementById("mobileMenuDrawer");
const mobileMenuOverlay = document.getElementById("mobileMenuOverlay");

function toggleMobileMenu(open) {
    if (open) {
        mobileMenuOverlay.classList.remove("hidden");
        setTimeout(() => mobileMenuDrawer.classList.remove("translate-x-full"), 10);
    } else {
        mobileMenuDrawer.classList.add("translate-x-full");
        setTimeout(() => mobileMenuOverlay.classList.add("hidden"), 300);
    }
}

menuToggleBtn.addEventListener("click", () => toggleMobileMenu(true));
menuCloseBtn.addEventListener("click", () => toggleMobileMenu(false));
mobileMenuOverlay.addEventListener("click", () => toggleMobileMenu(false));

function escapeHTML(value = "") {
    return String(value).replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    })[char]);
}

function initials(name = "F") {
    return name.trim().split(/\s+/).slice(0,2).map(p => p[0] || "").join("").toUpperCase();
}

function renderAvatar(profile, classes = "") {
    const name = profile?.full_name || profile?.username || "U";
    const avatar = profile?.avatar_url;

    if (avatar && /^https?:\/\//i.test(avatar)) {
        return `
            <div class="${classes} overflow-hidden">
                <img src="${escapeHTML(avatar)}" alt="${escapeHTML(name)}" class="w-full h-full object-cover">
            </div>
        `;
    }

    return `<div class="${classes}">${escapeHTML(initials(name))}</div>`;
}

async function loadAvatarImages() {
    const elements = document.querySelectorAll("[data-avatar-user]");
    for (const element of elements) {
        const id = element.dataset.avatarUser;
        const profile = profiles[id];
        if (!profile?.avatar_url) continue;

        const { data, error } = await supabase.storage.from("avatars").createSignedUrl(profile.avatar_url, 3600);
        if (error || !data?.signedUrl) continue;

        const img = document.createElement("img");
        img.src = data.signedUrl;
        img.alt = "Foto de perfil";
        img.className = "w-full h-full object-cover";
        element.replaceChildren(img);
    }
}

function notify(message, icon = "success") {
    Swal.fire({ toast:true, position:"top", icon, title:message, showConfirmButton:false, timer:2200 });
}

function showError(message) {
    Swal.fire({ icon:"error", title:"Ops!", text:message });
}

function getOtherUser(friendship) {
    return friendship.user_a === currentUser.id ? friendship.user_b : friendship.user_a;
}

function profileUrl(id) {
    return `./perfil.html?id=${encodeURIComponent(id)}`;
}

async function initialize() {
    const { data, error } = await supabase.auth.getSession();
    if (error || !data.session) { location.replace("./login.html"); return; }
    currentUser = data.session.user;

    const { data: profile } = await supabase.from("profiles").select("id,full_name,username,avatar_url").eq("id", currentUser.id).maybeSingle();
    currentProfile = profile || { full_name: currentUser.email?.split("@")[0] || "Usuário" };

    document.getElementById("sideName").textContent = currentProfile.full_name || "Usuário";
    document.getElementById("sideUsername").textContent = "@" + (currentProfile.username || "usuario");
    document.getElementById("sideAvatar").innerHTML = renderAvatar(currentProfile, "w-full h-full rounded-full flex items-center justify-center");

    await loadFriendships();
}

async function loadFriendships() {
    content.innerHTML = `<div class="p-12 text-center text-gray-400 text-xs">Atualizando amizades...</div>`;

    const { data, error } = await supabase
        .from("friendships")
        .select("id,user_a,user_b,requested_by,status,created_at")
        .or(`user_a.eq.${currentUser.id},user_b.eq.${currentUser.id}`)
        .in("status",["pending","accepted"])
        .order("created_at",{ascending:false});

    if (error) {
        content.innerHTML = `<div class="p-12 text-center text-red-500 text-xs">Erro ao carregar amizades: ${escapeHTML(error.message)}</div>`;
        return;
    }

    friendships = data || [];
    await loadProfiles();
    updateCounts();
    renderTab();
}

async function loadProfiles() {
    const ids = [...new Set(friendships.map(getOtherUser))];
    if (ids.length === 0) { profiles = {}; return; }

    const { data } = await supabase.from("profiles").select("id,full_name,username,avatar_url,city,state").in("id",ids);
    profiles = {};
    (data || []).forEach(p => profiles[p.id] = p);
}

function getFriends() { return friendships.filter(item => item.status === "accepted"); }
function getReceived() { return friendships.filter(item => item.status === "pending" && item.requested_by !== currentUser.id); }
function getSent() { return friendships.filter(item => item.status === "pending" && item.requested_by === currentUser.id); }

function updateCounts() {
    document.getElementById("friendsCount").textContent = getFriends().length;
    document.getElementById("receivedCount").textContent = getReceived().length;
    document.getElementById("sentCount").textContent = getSent().length;
}

document.querySelectorAll(".tab-btn").forEach(button => {
    button.addEventListener("click", () => {
        activeTab = button.dataset.tab;
        document.querySelectorAll(".tab-btn").forEach(tab => {
            const isCurrent = tab === button;
            tab.classList.toggle("text-cyan-700", isCurrent);
            tab.classList.toggle("bg-cyan-50", isCurrent);
            tab.classList.toggle("border-cyan-200", isCurrent);
            tab.classList.toggle("font-bold", isCurrent);
            tab.classList.toggle("text-gray-500", !isCurrent);
            tab.classList.toggle("font-semibold", !isCurrent);
        });
        renderTab();
    });
});

function renderTab() {
    let list = [];
    if (activeTab === "friends") list = getFriends();
    if (activeTab === "received") list = getReceived();
    if (activeTab === "sent") list = getSent();

    const titles = { friends:"Seus amigos", received:"Solicitações recebidas", sent:"Solicitações enviadas" };

    if (list.length === 0) {
        const messages = {
            friends:"Você ainda não tem amigos adicionados.",
            received:"Você não tem solicitações pendentes.",
            sent:"Você não enviou solicitações de amizade."
        };
        content.innerHTML = `
            <div class="p-12 text-center">
                <div class="w-16 h-16 rounded-2xl bg-gray-100 flex items-center justify-center mx-auto mb-4 border border-gray-200">
                    <i data-lucide="users" class="w-7 h-7 text-gray-400"></i>
                </div>
                <h3 class="font-bold text-slate-800 mb-1">${titles[activeTab]}</h3>
                <p class="text-xs text-gray-500">${messages[activeTab]}</p>
            </div>
        `;
        lucide.createIcons();
        return;
    }

    content.innerHTML = `
        <div class="p-5 border-b border-gray-100 bg-gray-50/50">
            <h2 class="font-bold text-sm text-slate-900">${titles[activeTab]}</h2>
        </div>
        <div class="divide-y divide-gray-100">
            ${list.map(item => renderPersonCard(item)).join("")}
        </div>
    `;

    attachCardEvents();
    loadAvatarImages();
}

function renderPersonCard(friendship) {
    const id = getOtherUser(friendship);
    const profile = profiles[id];
    if (!profile) return `<div class="p-4 text-xs text-gray-400">Perfil indisponível.</div>`;

    const name = profile.full_name || "Usuário";
    const username = profile.username || "usuario";
    const location = [profile.city, profile.state].filter(Boolean).join(" - ");

    let actions = "";
    if (activeTab === "friends") {
        actions = `
            <button class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-slate-800 rounded-xl text-xs font-semibold transition" data-action="profile" data-id="${id}">Ver perfil</button>
            <button class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-semibold transition" data-action="remove" data-id="${id}">Remover</button>
        `;
    } else if (activeTab === "received") {
        actions = `
            <button class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl text-xs font-bold transition shadow-sm" data-action="accept" data-id="${id}">Aceitar</button>
            <button class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-semibold transition" data-action="decline" data-id="${id}">Recusar</button>
            <button class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-slate-800 rounded-xl text-xs font-semibold transition" data-action="profile" data-id="${id}">Ver perfil</button>
        `;
    } else {
        actions = `
            <button class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-slate-800 rounded-xl text-xs font-semibold transition" data-action="profile" data-id="${id}">Ver perfil</button>
            <button class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-semibold transition" data-action="cancel" data-id="${id}">Cancelar</button>
        `;
    }

    return `
        <div class="p-4 flex items-center gap-4 hover:bg-gray-50/80 transition">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-cyan-600 to-violet-600 text-white font-black flex items-center justify-center overflow-hidden shrink-0 shadow-sm" data-avatar-user="${escapeHTML(id)}">
                ${escapeHTML(initials(name))}
            </div>
            <div class="flex-1 min-w-0">
                <strong class="block text-sm font-bold text-slate-900 truncate">${escapeHTML(name)}</strong>
                <small class="text-xs text-gray-500">@${escapeHTML(username)}${location ? ` · ${escapeHTML(location)}` : ""}</small>
                <div class="flex items-center gap-2 mt-2">${actions}</div>
            </div>
        </div>
    `;
}

function attachCardEvents() {
    content.querySelectorAll("[data-action]").forEach(button => {
        button.addEventListener("click", async () => {
            const action = button.dataset.action;
            const userId = button.dataset.id;
            const friendship = friendships.find(item => getOtherUser(item) === userId);
            if (!friendship) return;

            if (action === "profile") { location.href = profileUrl(userId); return; }
            if (action === "accept") { await acceptRequest(friendship, userId); return; }
            if (action === "decline") { await declineRequest(friendship); return; }
            if (action === "cancel") { await cancelRequest(friendship); return; }
            if (action === "remove") { await removeFriend(friendship); return; }
        });
    });
    lucide.createIcons();
}

async function acceptRequest(friendship, targetId) {
    const { error } = await supabase.rpc("respond_friend_request", { p_friendship_id: friendship.id, p_accept: true });
    if (error) { showError(error.message); return; }

    await supabase.from("notifications").insert({
        recipient_id: targetId,
        actor_id: currentUser.id,
        notification_type: "friend_accepted",
        message: `${currentProfile.full_name || 'Alguém'} aceitou sua solicitação de amizade.`
    });

    notify("Amizade confirmada!");
    await loadFriendships();
}

async function declineRequest(friendship) {
    const confirm = await Swal.fire({ title: "Recusar solicitação?", icon: "question", showCancelButton: true, confirmButtonColor: "#dc2626" });
    if (!confirm.isConfirmed) return;

    const { error } = await supabase.rpc("respond_friend_request", { p_friendship_id: friendship.id, p_accept: false });
    if (error) { showError(error.message); return; }
    notify("Solicitação recusada.");
    await loadFriendships();
}

async function cancelRequest(friendship) {
    const confirm = await Swal.fire({ title: "Cancelar solicitação?", icon: "question", showCancelButton: true, confirmButtonColor: "#dc2626" });
    if (!confirm.isConfirmed) return;

    const { error } = await supabase.rpc("cancel_friend_request", { p_friendship_id: friendship.id });
    if (error) { showError(error.message); return; }
    notify("Solicitação cancelada.");
    await loadFriendships();
}

async function removeFriend(friendship) {
    const confirm = await Swal.fire({ title: "Remover amizade?", icon: "warning", showCancelButton: true, confirmButtonColor: "#dc2626" });
    if (!confirm.isConfirmed) return;

    const { error } = await supabase.rpc("remove_friendship", { p_friendship_id: friendship.id });
    if (error) { showError(error.message); return; }
    notify("Amizade removida.");
    await loadFriendships();
}

// Pesquisa
searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    const term = searchInput.value.trim();
    if (term.length < 2) { searchResults.innerHTML = ""; return; }

    searchResults.innerHTML = `<div class="p-6 text-center text-gray-400 text-xs">Pesquisando pessoas...</div>`;
    searchTimer = setTimeout(() => searchPeople(term), 400);
});

async function searchPeople(term) {
    const cleanTerm = term.replace(/^@/, "");
    const { data, error } = await supabase
        .from("profiles")
        .select("id,full_name,username,avatar_url,city,state")
        .neq("id", currentUser.id)
        .or(`full_name.ilike.%${cleanTerm}%,username.ilike.%${cleanTerm}%`)
        .limit(20);

    if (error || !data || data.length === 0) {
        searchResults.innerHTML = `<div class="bg-white border border-gray-200 rounded-2xl p-6 text-center text-gray-400 text-xs">Nenhuma pessoa encontrada.</div>`;
        return;
    }

    const friendshipMap = {};
    friendships.forEach(item => friendshipMap[getOtherUser(item)] = item);

    searchResults.innerHTML = `
        <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm">
            <div class="p-5 border-b border-gray-100 bg-gray-50/50">
                <h2 class="font-bold text-sm text-slate-900">Resultados da pesquisa</h2>
            </div>
            <div class="divide-y divide-gray-100">
                ${data.map(profile => {
                    const relation = friendshipMap[profile.id];
                    let actionBtn = `<button class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl text-xs font-bold transition shadow-sm" data-search-action="add" data-id="${profile.id}">Adicionar</button>`;

                    if (relation?.status === "accepted") {
                        actionBtn = `<span class="text-xs text-emerald-600 font-semibold">Amigos</span>`;
                    } else if (relation?.status === "pending") {
                        actionBtn = `<span class="text-xs text-amber-600 font-semibold">Pendente</span>`;
                    }

                    return `
                        <div class="p-4 flex items-center gap-4 hover:bg-gray-50/80 transition">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-cyan-600 to-violet-600 text-white font-black flex items-center justify-center overflow-hidden shrink-0 shadow-sm" data-avatar-user="${escapeHTML(profile.id)}">
                                ${escapeHTML(initials(profile.full_name))}
                            </div>
                            <div class="flex-1 min-w-0">
                                <strong class="block text-sm font-bold text-slate-900 truncate">${escapeHTML(profile.full_name || "Usuário")}</strong>
                                <small class="text-xs text-gray-500">@${escapeHTML(profile.username || "usuario")}</small>
                                <div class="flex items-center gap-2 mt-2">
                                    <button class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-slate-800 rounded-xl text-xs font-semibold transition" data-search-action="profile" data-id="${profile.id}">Ver perfil</button>
                                    ${actionBtn}
                                </div>
                            </div>
                        </div>
                    `;
                }).join("")}
            </div>
        </div>
    `;

    data.forEach(p => profiles[p.id] = p);

    searchResults.querySelectorAll("[data-search-action]").forEach(button => {
        button.addEventListener("click", async () => {
            const action = button.dataset.searchAction;
            const id = button.dataset.id;
            if (action === "profile") { location.href = profileUrl(id); return; }
            if (action === "add") { await sendFriendRequest(id); }
        });
    });

    loadAvatarImages();
    lucide.createIcons();
}

async function sendFriendRequest(targetId) {
    if (targetId === currentUser.id) return;

    const [userA, userB] = [currentUser.id, targetId].sort();
    const { error } = await supabase.from("friendships").insert({
        user_a: userA,
        user_b: userB,
        requested_by: currentUser.id,
        status: "pending"
    });

    if (error) { showError(error.message); return; }

    await supabase.from("notifications").insert({
        recipient_id: targetId,
        actor_id: currentUser.id,
        notification_type: "friend_request",
        message: `${currentProfile.full_name || 'Alguém'} enviou uma solicitação de amizade.`
    });

    notify("Solicitação enviada!");
    await loadFriendships();
    const term = searchInput.value.trim();
    if (term.length >= 2) searchPeople(term);
}

// Navegação global
document.querySelectorAll("[data-nav]").forEach(btn => {
    btn.addEventListener("click", () => {
        const destinations = { feed:"./feed.html", friends:"./amigos.html", notifications:"./notificacoes.html", profile:"./perfil.html" };
        if (destinations[btn.dataset.nav]) window.location.href = destinations[btn.dataset.nav];
    });
});

document.getElementById("profileButton").addEventListener("click", () => window.location.href = "./perfil.html");

const handleLogout = async () => {
    const confirm = await Swal.fire({ title:"Sair da conta?", icon:"question", showCancelButton:true, confirmButtonColor:"#0891b2" });
    if (confirm.isConfirmed) { await supabase.auth.signOut(); window.location.replace("./login.html"); }
};

document.getElementById("logoutButton").addEventListener("click", handleLogout);

initialize().catch(error => showError(error.message || "Erro ao iniciar a página."));
lucide.createIcons();
</script>

</body>
</html>
