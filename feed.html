<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030712">

<title>Feed | FaceCrato</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #030712;
    color: #f8fafc;
    font-family: 'Inter', system-ui, sans-serif;
    overflow-x: hidden;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }

:root {
    --bg-deep: #030712;
    --card-bg: rgba(13, 18, 32, 0.75);
    --card-border: rgba(99, 102, 241, 0.18);
    --card-border-hover: rgba(99, 102, 241, 0.45);
    --neon-cyan: #06b6d4;
    --neon-purple: #8b5cf6;
    --muted: #94a3b8;
}

/* FUNDO COM LUZES AMBIENTES NEON */
body::before {
    content: "";
    position: fixed;
    top: -20vh;
    left: -10vw;
    width: 50vw;
    height: 50vh;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.12), transparent 70%);
    z-index: -1;
    pointer-events: none;
}
body::after {
    content: "";
    position: fixed;
    bottom: -20vh;
    right: -10vw;
    width: 50vw;
    height: 50vh;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.1), transparent 70%);
    z-index: -1;
    pointer-events: none;
}

/* TOPBAR GLASSMORPHISM AVANÇADO */
.topbar {
    height: 72px;
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(3, 7, 18, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.topbar-inner {
    max-width: 1200px;
    height: 100%;
    margin: auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 24px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 24px;
    font-weight: 950;
    letter-spacing: -1.2px;
    color: #ffffff;
}

.logo-mark {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #06b6d4, #8b5cf6);
    color: white;
    font-size: 22px;
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
}

.search-box {
    flex: 1;
    max-width: 400px;
    position: relative;
}

.search-box input {
    width: 100%;
    height: 44px;
    padding: 0 16px 0 44px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    background: rgba(15, 23, 42, 0.6);
    color: white;
    outline: none;
    transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
}

.search-box input:focus {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
}

.search-box i {
    position: absolute;
    left: 15px;
    top: 14px;
    color: var(--muted);
    width: 18px;
}

.top-actions {
    margin-left: auto;
    display: flex;
    gap: 12px;
    align-items: center;
}

.icon-btn {
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    background: var(--card-bg);
    color: #cbd5e1;
    display: grid;
    place-items: center;
    transition: all .25s ease;
}

.icon-btn:hover {
    background: rgba(30, 41, 59, 0.9);
    border-color: var(--neon-cyan);
    color: #ffffff;
    box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
    transform: translateY(-2px);
}
.icon-btn svg { width: 20px; }

/* AVATAR COM NEON PULSANTE */
.avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #06b6d4, #8b5cf6);
    display: grid;
    place-items: center;
    color: white;
    font-weight: 900;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
}

.avatar img { width: 100%; height: 100%; object-fit: cover; }

.avatar.online::after {
    content: "";
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 12px;
    height: 12px;
    background: #10b981;
    border: 2px solid #030712;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
}

/* LAYOUT */
.layout {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: 260px minmax(0, 620px) 280px;
    gap: 28px;
    align-items: start;
}

.panel {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    transition: border-color .3s ease;
}

.panel:hover {
    border-color: var(--card-border-hover);
}

/* SIDEBAR */
.sidebar {
    position: sticky;
    top: 98px;
    padding: 22px;
}

.profile-mini {
    display: flex;
    gap: 14px;
    align-items: center;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    margin-bottom: 16px;
}

.profile-mini strong { display: block; font-size: 15px; color: #ffffff; }
.profile-mini small { color: var(--muted); font-size: 13px; }

.nav-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    color: var(--muted);
    border: 0;
    background: transparent;
    border-radius: 14px;
    text-align: left;
    margin: 4px 0;
    font-size: 14px;
    font-weight: 600;
    transition: all .25s ease;
}

.nav-btn:hover {
    background: rgba(255, 255, 255, 0.04);
    color: #e2e8f0;
}

.nav-btn.active {
    background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(139, 92, 246, 0.15));
    color: #06b6d4;
    border: 1px solid rgba(6, 182, 212, 0.35);
    font-weight: 750;
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.15);
}
.nav-btn svg { width: 20px; }

.sidebar-note {
    margin-top: 24px;
    padding: 16px;
    border-radius: 14px;
    background: rgba(3, 7, 18, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.05);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
}

.feed-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.feed-header h1 { font-size: 26px; font-weight: 950; letter-spacing: -1px; margin: 0; color: #ffffff; }
.feed-header p { color: var(--muted); font-size: 13px; margin: 4px 0 0; }

.refresh-btn {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: #cbd5e1;
    border-radius: 14px;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    transition: all .25s ease;
}
.refresh-btn:hover { background: rgba(30, 41, 59, 0.9); border-color: var(--neon-cyan); color: #fff; }

.tabs {
    display: flex;
    gap: 8px;
    padding: 6px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    margin-bottom: 22px;
}

.tab {
    flex: 1;
    border: 0;
    padding: 12px;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 750;
    transition: all .25s ease;
}

.tab.active {
    color: #ffffff;
    background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
    border: 1px solid rgba(6, 182, 212, 0.4);
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
}

.composer {
    padding: 22px;
    margin-bottom: 22px;
}

.composer-top {
    display: flex;
    gap: 14px;
    align-items: flex-start;
}

.composer textarea {
    width: 100%;
    min-height: 85px;
    resize: none;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    background: rgba(3, 7, 18, 0.6);
    color: white;
    padding: 16px;
    outline: none;
    font-size: 14px;
    transition: all .3s ease;
}
.composer textarea:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(6, 182, 212, 0.2); }
.composer textarea::placeholder { color: #64748b; }

.composer-options {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
}

.option-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(3, 7, 18, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px 14px;
    color: #cbd5e1;
    font-size: 13px;
    font-weight: 600;
    transition: all .25s ease;
}
.option-btn svg { width: 18px; }
.option-btn:hover { background: rgba(30, 41, 59, 0.9); border-color: var(--neon-cyan); color: white; }

.composer select {
    margin-left: auto;
    background: rgba(3, 7, 18, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #cbd5e1;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    outline: none;
}

.publish-btn {
    background: linear-gradient(135deg, #06b6d4, #8b5cf6);
    color: white;
    border: 0;
    border-radius: 12px;
    padding: 11px 24px;
    font-size: 13px;
    font-weight: 900;
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.35);
    transition: all .25s ease;
}
.publish-btn:hover { filter: brightness(1.15); box-shadow: 0 0 25px rgba(139, 92, 246, 0.5); transform: translateY(-1px); }
.publish-btn:disabled { opacity: .5; cursor: wait; transform: none; }

.file-preview {
    display: none;
    margin: 12px 0 0 58px;
    color: #06b6d4;
    font-size: 13px;
    font-weight: 700;
}

.post {
    padding: 24px;
    margin-bottom: 22px;
}

.post-header {
    display: flex;
    align-items: center;
    gap: 14px;
}

.post-author { flex: 1; min-width: 0; }
.post-author strong { display: block; font-size: 15px; color: #ffffff; }
.post-author small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }

.post-menu {
    background: none;
    color: var(--muted);
    border: 0;
    padding: 8px;
    border-radius: 10px;
    transition: all .2s ease;
}
.post-menu:hover { background: rgba(255, 255, 255, 0.05); color: white; }
.post-menu svg { width: 18px; }

.post-content {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.75;
    font-size: 15px;
    margin: 18px 0;
    color: #e2e8f0;
}

.post-content .hashtag { color: #06b6d4; font-weight: 800; text-decoration: none; }
.post-content .hashtag:hover { text-decoration: underline; }
.post-content .mention { color: #8b5cf6; font-weight: 800; background: rgba(139, 92, 246, 0.15); padding: 2px 6px; border-radius: 6px; }
.post-content .post-link { color: #06b6d4; text-decoration: underline; }

.post-media {
    width: 100%;
    max-height: 520px;
    object-fit: cover;
    border-radius: 16px;
    background: #000000;
    margin-bottom: 16px;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.post-stats {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.post-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding-top: 12px;
    position: relative;
}

.action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: transparent;
    border: 0;
    color: var(--muted);
    padding: 11px 6px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 650;
    transition: all .25s ease;
}
.action-btn svg { width: 18px; }
.action-btn:hover { background: rgba(255, 255, 255, 0.05); color: #f8fafc; }

.action-btn.reacted {
    color: #06b6d4;
    font-weight: 900;
    background: rgba(6, 182, 212, 0.12);
}
.action-btn.saved { color: #8b5cf6; }

/* REACTION POPUP CYBERPUNK */
.reaction-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
}

.reaction-popup {
    position: absolute;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%) scale(0.9);
    background: rgba(13, 18, 32, 0.95);
    backdrop-filter: blur(15px);
    border: 1px solid var(--neon-cyan);
    box-shadow: 0 0 25px rgba(6, 182, 212, 0.35);
    border-radius: 40px;
    padding: 8px 14px;
    display: none;
    gap: 10px;
    z-index: 30;
    opacity: 0;
    transition: all .2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.reaction-wrapper:hover .reaction-popup,
.reaction-popup.show {
    display: flex;
    opacity: 1;
    transform: translateX(-50%) scale(1);
}

.react-emoji-btn {
    background: none;
    border: 0;
    font-size: 26px;
    padding: 4px;
    border-radius: 50%;
    cursor: pointer;
    transition: transform .15s ease;
}
.react-emoji-btn:hover { transform: scale(1.4); background: rgba(255, 255, 255, 0.1); }

.comments-area {
    display: none;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    margin-top: 16px;
    padding-top: 18px;
}
.comments-area.open { display: block; }

.comment-item {
    display: flex;
    gap: 12px;
    margin: 14px 0;
}

.comment-bubble {
    background: rgba(3, 7, 18, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.06);
    padding: 12px 16px;
    border-radius: 16px;
    min-width: 0;
    flex: 1;
}

.comment-bubble strong { font-size: 12px; display: block; margin-bottom: 4px; color: #06b6d4; }
.comment-bubble p { font-size: 13.5px; margin: 0; color: #e2e8f0; white-space: pre-wrap; overflow-wrap: anywhere; }

.comment-form {
    display: flex;
    gap: 10px;
    margin-top: 16px;
}

.comment-form input {
    flex: 1;
    min-width: 0;
    background: rgba(3, 7, 18, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 12px 16px;
    outline: none;
    color: white;
    font-size: 13.5px;
}
.comment-form input:focus { border-color: var(--neon-cyan); }

.comment-form button {
    background: linear-gradient(135deg, #06b6d4, #8b5cf6);
    border: 0;
    border-radius: 14px;
    padding: 0 18px;
    color: white;
    transition: all .25s ease;
}
.comment-form button:hover { filter: brightness(1.15); box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
.comment-form button svg { width: 18px; }

.right-panel {
    position: sticky;
    top: 98px;
    padding: 22px;
}

.right-panel h3 { font-size: 15px; font-weight: 850; margin: 0 0 14px; color: #ffffff; }
.right-panel p { font-size: 13px; line-height: 1.7; color: var(--muted); }

.right-separator { height: 1px; background: rgba(255, 255, 255, 0.06); margin: 20px 0; }

.empty-state { padding: 50px 20px; text-align: center; color: var(--muted); }
.empty-state svg { width: 40px; height: 40px; margin: 0 auto 14px; color: #475569; }
.empty-state strong { display: block; color: #e2e8f0; font-size: 15px; margin-bottom: 8px; }
.empty-state p { font-size: 13px; line-height: 1.6; }

.skeleton-post {
    padding: 24px;
    margin-bottom: 22px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
}
.skeleton-line {
    background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 8px;
}
@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

.mobile-nav { display: none; }

@media(max-width: 1050px) {
    .layout { grid-template-columns: 220px minmax(0, 1fr); max-width: 900px; }
    .right-panel { display: none; }
}

@media(max-width: 768px) {
    .topbar-inner { padding: 0 16px; gap: 14px; }
    .logo { font-size: 20px; }
    .logo-mark { width: 38px; height: 38px; }
    .search-box { display: none; }
    .layout { display: block; padding: 0 16px; margin: 20px auto 100px; }
    .sidebar { display: none; }
    .feed-header h1 { font-size: 23px; }
    .composer, .post { padding: 18px; border-radius: 18px; }
    .composer select { margin-left: 0; flex: 1; }
    .publish-btn { flex: 1; }
    .mobile-nav {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        z-index: 60;
        display: flex;
        justify-content: space-around;
        padding: 12px 8px calc(12px + env(safe-area-inset-bottom));
        background: rgba(3, 7, 18, 0.9);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
    }
    .mobile-nav button {
        border: 0; background: none; color: var(--muted);
        display: grid; justify-items: center; gap: 5px;
        font-size: 11px; font-weight: 650;
    }
    .mobile-nav button.active { color: #06b6d4; text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }
    .mobile-nav svg { width: 22px; height: 22px; }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="topbar-inner">
        <div class="logo">
            <div class="logo-mark">F</div>
            FaceCrato
        </div>

        <div class="search-box">
            <i data-lucide="search"></i>
            <input type="search" placeholder="Pesquisar no FaceCrato..." disabled>
        </div>

        <div class="top-actions">
            <button class="icon-btn" id="notificationsButton" title="Notificações"><i data-lucide="bell"></i></button>
            <button class="icon-btn" id="profileButton" title="Meu perfil"><i data-lucide="user-round"></i></button>
            <button class="icon-btn" id="logoutButton" title="Sair"><i data-lucide="log-out"></i></button>
        </div>
    </div>
</header>

<main class="layout">
    <aside class="sidebar panel">
        <div class="profile-mini">
            <div class="avatar online" id="sideAvatar">F</div>
            <div>
                <strong id="sideName">Carregando...</strong>
                <small id="sideUsername">@...</small>
            </div>
        </div>

        <button class="nav-btn active" data-nav="feed"><i data-lucide="house"></i> Feed</button>
        <button class="nav-btn" data-nav="friends"><i data-lucide="users"></i> Amigos</button>
        <button class="nav-btn" data-nav="notifications"><i data-lucide="bell"></i> Notificações</button>
        <button class="nav-btn" data-nav="profile"><i data-lucide="user-round"></i> Meu perfil</button>

        <div class="sidebar-note">
            <strong>FACECRATO</strong><br>
            Conectando pessoas em alto estilo.
        </div>
    </aside>

    <section>
        <div class="feed-header">
            <div>
                <h1>Seu feed</h1>
                <p>O que está rolando na rede?</p>
            </div>
            <button class="refresh-btn" id="refreshButton" title="Atualizar feed"><i data-lucide="refresh-cw"></i></button>
        </div>

        <div class="tabs">
            <button class="tab active" data-feed="discover"><i data-lucide="compass" style="width:15px;vertical-align:middle"></i> Para você</button>
            <button class="tab" data-feed="friends"><i data-lucide="users" style="width:15px;vertical-align:middle"></i> Amigos</button>
        </div>

        <div class="composer panel">
            <div class="composer-top">
                <div class="avatar online" id="composerAvatar">F</div>
                <textarea id="postContent" maxlength="5000" placeholder="O que está acontecendo? Use #hashtags..."></textarea>
            </div>

            <div class="file-preview" id="filePreview"></div>

            <div class="composer-options">
                <label class="option-btn" for="mediaInput"><i data-lucide="image"></i> Foto/vídeo</label>
                <input id="mediaInput" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" hidden>

                <select id="visibility">
                    <option value="public">Público</option>
                    <option value="friends">Amigos</option>
                    <option value="private">Privado</option>
                </select>

                <button class="publish-btn" id="publishButton">Publicar</button>
            </div>
        </div>

        <div id="postsContainer">
            <div class="skeleton-post">
                <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px;">
                    <div class="skeleton-line" style="width:44px;height:44px;border-radius:50%;"></div>
                    <div style="flex:1;"><div class="skeleton-line" style="width:130px;height:14px;margin-bottom:6px;"></div><div class="skeleton-line" style="width:80px;height:10px;"></div></div>
                </div>
                <div class="skeleton-line" style="width:100%;height:16px;margin-bottom:10px;"></div>
                <div class="skeleton-line" style="width:65%;height:16px;"></div>
            </div>
        </div>
    </section>

    <aside class="right-panel panel">
        <h3>Sobre o FaceCrato</h3>
        <p>Uma rede social independente e moderna criada para fortalecer conexões.</p>
        <div class="right-separator"></div>
        <h3>Comunidade</h3>
        <p>Novos recursos chegam em breve.</p>
        <div class="right-separator"></div>
        <p style="font-size:11px">FaceCrato © 2026</p>
    </aside>
</main>

<nav class="mobile-nav">
    <button class="active" data-nav="feed"><i data-lucide="house"></i> Feed</button>
    <button data-nav="friends"><i data-lucide="users"></i> Amigos</button>
    <button data-nav="notifications"><i data-lucide="bell"></i> Alertas</button>
    <button data-nav="profile"><i data-lucide="user-round"></i> Perfil</button>
</nav>

<script type="module">
import { supabase } from "./supabase.js";

const postsContainer = document.getElementById("postsContainer");
const postContent = document.getElementById("postContent");
const visibility = document.getElementById("visibility");
const mediaInput = document.getElementById("mediaInput");
const filePreview = document.getElementById("filePreview");
const publishButton = document.getElementById("publishButton");

let currentUser = null;
let currentProfile = null;
let currentFeed = "discover";
let loadingFeed = false;

const reactionIcons = {
    like: "👍",
    love: "❤️",
    haha: "😂",
    wow: "😮",
    sad: "😢",
    angry: "😡"
};

function escapeHTML(value = "") {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[char]);
}

function formatRichText(text = "") {
    let safe = escapeHTML(text);
    safe = safe.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener" class="post-link">$1</a>');
    safe = safe.replace(/#([a-zA-Z0-9_á-úÁ-Ú]+)/g, '<span class="hashtag">#$1</span>');
    safe = safe.replace(/@([a-zA-Z0-9_]+)/g, '<span class="mention">@$1</span>');
    return safe;
}

function initials(name = "F") {
    return name.trim().split(/\s+/).slice(0,2).map(p => p[0] || "").join("").toUpperCase();
}

function formatDate(date) {
    return new Intl.DateTimeFormat("pt-BR", {
        day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"
    }).format(new Date(date));
}

function showError(text) {
    Swal.fire({ icon:"error", title:"Ops!", text, background:"#0d1220", color:"#f8fafc", confirmButtonColor:"#06b6d4" });
}

function showSuccess(text) {
    Swal.fire({ toast:true, position:"top", icon:"success", title:text, showConfirmButton:false, timer:2200, background:"#0d1220", color:"#f8fafc" });
}

function setAvatar(element, profile) {
    if (!element) return;
    const name = profile?.full_name || profile?.username || "FaceCrato";
    element.textContent = initials(name);
    if (profile?.avatar_url) {
        element.innerHTML = `<img src="${escapeHTML(profile.avatar_url)}" alt="">`;
    }
}

async function initialize() {
    const { data, error } = await supabase.auth.getSession();
    if (error || !data.session) {
        window.location.replace("./login.html");
        return;
    }

    currentUser = data.session.user;

    const { data: profile } = await supabase
        .from("profiles")
        .select("id,username,full_name,avatar_url")
        .eq("id", currentUser.id)
        .maybeSingle();

    currentProfile = profile || {
        id: currentUser.id,
        username: currentUser.email?.split("@")[0] || "usuario",
        full_name: currentUser.email?.split("@")[0] || "Usuário"
    };

    document.getElementById("sideName").textContent = currentProfile.full_name || "Usuário";
    document.getElementById("sideUsername").textContent = "@" + (currentProfile.username || "usuario");

    setAvatar(document.getElementById("sideAvatar"), currentProfile);
    setAvatar(document.getElementById("composerAvatar"), currentProfile);

    await loadFeed();
}

async function getFriendIds() {
    const { data, error } = await supabase
        .from("friendships")
        .select("user_a,user_b")
        .eq("status", "accepted")
        .or(`user_a.eq.${currentUser.id},user_b.eq.${currentUser.id}`);

    if (error) throw error;
    const ids = new Set([currentUser.id]);
    (data || []).forEach(f => ids.add(f.user_a === currentUser.id ? f.user_b : f.user_a));
    return [...ids];
}

async function loadFeed() {
    if (loadingFeed) return;
    loadingFeed = true;

    postsContainer.innerHTML = `
        <div class="skeleton-post"><div style="display:flex;gap:14px;align-items:center;margin-bottom:16px;"><div class="skeleton-line" style="width:44px;height:44px;border-radius:50%;"></div><div style="flex:1;"><div class="skeleton-line" style="width:130px;height:14px;margin-bottom:6px;"></div><div class="skeleton-line" style="width:80px;height:10px;"></div></div></div><div class="skeleton-line" style="width:100%;height:16px;margin-bottom:10px;"></div><div class="skeleton-line" style="width:70%;height:16px;"></div></div>
    `;

    try {
        let query = supabase
            .from("posts")
            .select(`id, user_id, content, post_type, visibility, comments_permission, created_at, edited_at`)
            .order("created_at", { ascending:false })
            .limit(40);

        if (currentFeed === "friends") {
            const friendIds = await getFriendIds();
            query = query.in("user_id", friendIds);
        }

        const { data: posts, error } = await query;
        if (error) throw error;

        if (!posts || posts.length === 0) {
            postsContainer.innerHTML = `
                <div class="panel empty-state">
                    <i data-lucide="messages-square"></i>
                    <strong>Nenhuma publicação por aqui</strong>
                    <p>Quando houver publicações disponíveis, elas aparecerão aqui.</p>
                </div>
            `;
            lucide.createIcons();
            return;
        }

        const postIds = posts.map(p => p.id);
        const userIds = [...new Set(posts.map(p => p.user_id))];

        const [profilesRes, mediaRes, reactionsRes, commentsRes, savedRes] = await Promise.all([
            supabase.from("profiles").select("id,username,full_name,avatar_url").in("id", userIds),
            supabase.from("post_media").select("id,post_id,media_url,media_type,position").in("post_id", postIds).order("position"),
            supabase.from("reactions").select("post_id,user_id,reaction_type").in("post_id", postIds),
            supabase.from("comments").select("id,post_id,user_id,content,created_at,parent_id").in("post_id", postIds).is("parent_id", null).order("created_at", { ascending:true }),
            supabase.from("saved_posts").select("post_id").eq("user_id", currentUser.id).in("post_id", postIds)
        ]);

        const profileMap = Object.fromEntries((profilesRes.data || []).map(p => [p.id, p]));
        const mediaMap = {};
        (mediaRes.data || []).forEach(m => {
            if (!mediaMap[m.post_id]) mediaMap[m.post_id] = [];
            mediaMap[m.post_id].push(m);
        });
        const commentsMap = {};
        (commentsRes.data || []).forEach(c => {
            if (!commentsMap[c.post_id]) commentsMap[c.post_id] = [];
            commentsMap[c.post_id].push(c);
        });
        const reactionMap = {};
        (reactionsRes.data || []).forEach(r => {
            if (!reactionMap[r.post_id]) reactionMap[r.post_id] = [];
            reactionMap[r.post_id].push(r);
        });
        const saved = new Set((savedRes.data || []).map(s => s.post_id));

        const prepared = await Promise.all(posts.map(async post => {
            const postMedia = mediaMap[post.id] || [];
            const signedMedia = await Promise.all(postMedia.map(async item => {
                const { data } = await supabase.storage.from("post-media").createSignedUrl(item.media_url, 3600);
                return {...item, signedUrl: data?.signedUrl || null};
            }));

            return {
                ...post,
                author: profileMap[post.user_id],
                media: signedMedia,
                reactions: reactionMap[post.id] || [],
                comments: commentsMap[post.id] || [],
                saved: saved.has(post.id)
            };
        }));

        renderPosts(prepared);

    } catch (error) {
        console.error("Erro feed:", error);
        postsContainer.innerHTML = `
            <div class="panel empty-state">
                <i data-lucide="alert-circle"></i>
                <strong>Erro ao carregar feed</strong>
                <p>${escapeHTML(error.message)}</p>
                <button class="publish-btn" id="retryFeed" style="margin-top:14px;">Tentar novamente</button>
            </div>
        `;
        document.getElementById("retryFeed")?.addEventListener("click", loadFeed);
        lucide.createIcons();
    } finally {
        loadingFeed = false;
    }
}

function renderPosts(posts) {
    postsContainer.innerHTML = posts.map(post => {
        const author = post.author || { full_name:"Usuário", username:"usuario" };
        const userReaction = post.reactions.find(r => r.user_id === currentUser.id);
        const reactionCount = post.reactions.length;
        const commentCount = post.comments.length;

        const reactionSummary = Object.entries(
            post.reactions.reduce((acc, r) => {
                acc[r.reaction_type] = (acc[r.reaction_type] || 0) + 1;
                return acc;
            }, {})
        ).map(([type, count]) => `${reactionIcons[type] || "👍"} ${count}`).join(" ");

        const mediaHTML = post.media.map(m => {
            if (!m.signedUrl) return "";
            if (m.media_type === "video") {
                return `<video class="post-media" controls preload="metadata"><source src="${escapeHTML(m.signedUrl)}"></video>`;
            }
            return `<img class="post-media" src="${escapeHTML(m.signedUrl)}" alt="Mídia" loading="lazy">`;
        }).join("");

        const commentsHTML = post.comments.map(c => {
            return `
                <div class="comment-item">
                    <div class="avatar" style="width:36px;height:36px;font-size:11px">
                        ${escapeHTML(initials(author.full_name || "U"))}
                    </div>
                    <div class="comment-bubble">
                        <strong>${escapeHTML(author.full_name || "Usuário")}</strong>
                        <p>${formatRichText(c.content)}</p>
                    </div>
                </div>
            `;
        }).join("");

        const visibilityLabel = { public:"Público", friends:"Amigos", private:"Privado" }[post.visibility] || "Público";

        return `
            <article class="post panel" data-post-id="${post.id}">
                <div class="post-header">
                    <div class="avatar online">${escapeHTML(initials(author.full_name || author.username))}</div>
                    <div class="post-author">
                        <strong>${escapeHTML(author.full_name || "Usuário")}</strong>
                        <small>@${escapeHTML(author.username || "usuario")} · ${escapeHTML(formatDate(post.created_at))} · ${visibilityLabel}</small>
                    </div>
                    ${post.user_id === currentUser.id ? `<button class="post-menu" data-action="delete-post" title="Excluir"><i data-lucide="trash-2"></i></button>` : ""}
                </div>

                ${post.content ? `<div class="post-content">${formatRichText(post.content)}</div>` : ""}
                ${mediaHTML}

                <div class="post-stats">
                    <span>${reactionSummary || " "}</span>
                    <span>${commentCount} comentário(s)</span>
                </div>

                <div class="post-actions">
                    <div class="reaction-wrapper">
                        <button class="action-btn ${userReaction ? "reacted" : ""}" data-action="like-click">
                            <span>${userReaction ? reactionIcons[userReaction.reaction_type] : "👍"}</span>
                            ${userReaction ? "Reagiu" : "Curtir"} (${reactionCount})
                        </button>

                        <div class="reaction-popup" id="popup-${post.id}">
                            <button class="react-emoji-btn" data-reaction="like" data-post-id="${post.id}">👍</button>
                            <button class="react-emoji-btn" data-reaction="love" data-post-id="${post.id}">❤️</button>
                            <button class="react-emoji-btn" data-reaction="haha" data-post-id="${post.id}">😂</button>
                            <button class="react-emoji-btn" data-reaction="wow" data-post-id="${post.id}">😮</button>
                            <button class="react-emoji-btn" data-reaction="sad" data-post-id="${post.id}">😢</button>
                            <button class="react-emoji-btn" data-reaction="angry" data-post-id="${post.id}">😡</button>
                        </div>
                    </div>

                    <button class="action-btn" data-action="toggle-comments">
                        <i data-lucide="message-circle"></i> Comentar
                    </button>

                    <button class="action-btn ${post.saved ? "saved" : ""}" data-action="save-post">
                        <i data-lucide="bookmark"></i> ${post.saved ? "Salvo" : "Salvar"}
                    </button>
                </div>

                <div class="comments-area" id="comments-${post.id}">
                    ${commentsHTML || `<p style="font-size:13px;color:var(--muted)">Nenhum comentário ainda.</p>`}
                    <form class="comment-form" data-post-id="${post.id}">
                        <input type="text" name="comment" placeholder="Escreva um comentário..." maxlength="2000" required>
                        <button type="submit"><i data-lucide="send"></i></button>
                    </form>
                </div>
            </article>
        `;
    }).join("");

    lucide.createIcons();
}

mediaInput.addEventListener("change", () => {
    const file = mediaInput.files[0];
    if (!file) { filePreview.style.display = "none"; return; }
    filePreview.style.display = "block";
    filePreview.textContent = `Arquivo: ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
});

publishButton.addEventListener("click", async () => {
    const content = postContent.value.trim();
    const file = mediaInput.files[0];

    if (!content && !file) {
        showError("Escreva alguma coisa ou escolha um arquivo.");
        return;
    }

    publishButton.disabled = true;
    publishButton.textContent = "Publicando...";

    try {
        const postType = file ? (file.type.startsWith("video/") ? "video" : "photo") : "text";
        const { data: post, error: postErr } = await supabase.from("posts").insert({
            user_id: currentUser.id,
            content,
            post_type: postType,
            visibility: visibility.value,
            comments_permission: "everyone"
        }).select("id").single();

        if (postErr) throw postErr;

        if (file) {
            const ext = file.name.split(".").pop();
            const filePath = `${currentUser.id}/${post.id}/${crypto.randomUUID()}.${ext}`;
            const { error: upErr } = await supabase.storage.from("post-media").upload(filePath, file, { contentType: file.type });
            if (upErr) throw upErr;

            await supabase.from("post_media").insert({
                post_id: post.id,
                media_url: filePath,
                media_type: file.type.startsWith("video/") ? "video" : "image",
                position: 0
            });
        }

        postContent.value = "";
        mediaInput.value = "";
        filePreview.style.display = "none";
        showSuccess("Publicação criada!");
        await loadFeed();
    } catch (err) {
        showError(err.message || "Erro ao publicar.");
    } finally {
        publishButton.disabled = false;
        publishButton.textContent = "Publicar";
    }
});

postsContainer.addEventListener("click", async event => {
    const target = event.target;
    const button = target.closest("[data-action]");
    const postElement = target.closest("[data-post-id]");
    
    if (target.classList.contains("react-emoji-btn")) {
        await applyReaction(target.dataset.postId, target.dataset.reaction);
        return;
    }

    if (!button || !postElement) return;
    const postId = postElement.dataset.postId;
    const action = button.dataset.action;

    if (action === "like-click") {
        const popup = document.getElementById(`popup-${postId}`);
        if (window.innerWidth <= 768) {
            const isVisible = popup.classList.contains("show");
            document.querySelectorAll(".reaction-popup").forEach(p => p.classList.remove("show"));
            if (!isVisible) popup.classList.add("show");
        } else {
            await applyReaction(postId, "like");
        }
        return;
    }

    if (action === "toggle-comments") {
        document.getElementById(`comments-${postId}`)?.classList.toggle("open");
    }

    if (action === "save-post") {
        const { data: existing } = await supabase.from("saved_posts").select("post_id").eq("post_id", postId).eq("user_id", currentUser.id).maybeSingle();
        if (existing) {
            await supabase.from("saved_posts").delete().eq("post_id", postId).eq("user_id", currentUser.id);
        } else {
            await supabase.from("saved_posts").insert({ post_id: postId, user_id: currentUser.id });
        }
        await loadFeed();
    }

    if (action === "delete-post") {
        const confirm = await Swal.fire({ title:"Excluir?", icon:"warning", showCancelButton:true, confirmButtonColor:"#dc2626", background:"#0d1220", color:"#f8fafc" });
        if (!confirm.isConfirmed) return;
        await supabase.from("posts").delete().eq("id", postId).eq("user_id", currentUser.id);
        showSuccess("Excluído com sucesso.");
        await loadFeed();
    }
});

async function applyReaction(postId, reactionType) {
    document.querySelectorAll(".reaction-popup").forEach(p => p.classList.remove("show"));
    const { data: existing } = await supabase.from("reactions").select("id,reaction_type").eq("post_id", postId).eq("user_id", currentUser.id).maybeSingle();

    if (existing) {
        if (existing.reaction_type === reactionType) {
            await supabase.from("reactions").delete().eq("post_id", postId).eq("user_id", currentUser.id);
        } else {
            await supabase.from("reactions").update({ reaction_type: reactionType }).eq("post_id", postId).eq("user_id", currentUser.id);
        }
    } else {
        await supabase.from("reactions").insert({ post_id: postId, user_id: currentUser.id, reaction_type: reactionType });
    }
    await loadFeed();
}

postsContainer.addEventListener("submit", async event => {
    const form = event.target.closest(".comment-form");
    if (!form) return;
    event.preventDefault();

    const postId = form.dataset.postId;
    const input = form.querySelector("input[name='comment']");
    const content = input.value.trim();
    if (!content) return;

    await supabase.from("comments").insert({ post_id: postId, user_id: currentUser.id, content });
    await loadFeed();
    document.getElementById(`comments-${postId}`)?.classList.add("open");
});

document.querySelectorAll("[data-feed]").forEach(btn => {
    btn.addEventListener("click", async () => {
        currentFeed = btn.dataset.feed;
        document.querySelectorAll("[data-feed]").forEach(b => b.classList.toggle("active", b === btn));
        await loadFeed();
    });
});

document.querySelectorAll("[data-nav]").forEach(btn => {
    btn.addEventListener("click", () => {
        const destinations = { feed:"./feed.html", friends:"./amigos.html", notifications:"./notificacoes.html", profile:"./perfil.html" };
        if (destinations[btn.dataset.nav]) window.location.href = destinations[btn.dataset.nav];
    });
});

document.getElementById("profileButton").addEventListener("click", () => window.location.href = "./perfil.html");
document.getElementById("notificationsButton").addEventListener("click", () => window.location.href = "./notificacoes.html");
document.getElementById("refreshButton").addEventListener("click", loadFeed);

document.getElementById("logoutButton").addEventListener("click", async () => {
    const confirm = await Swal.fire({ title:"Sair da conta?", icon:"question", showCancelButton:true, confirmButtonColor:"#06b6d4", background:"#0d1220", color:"#f8fafc" });
    if (confirm.isConfirmed) {
        await supabase.auth.signOut();
        window.location.replace("./login.html");
    }
});

initialize();
</script>

</body>
</html>
