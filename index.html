<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">

<title>FaceCrato - A rede do Cariri</title>

<link rel="manifest" href="./manifest.json">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1120;
    color: #f8fafc;
    font-family: Arial, sans-serif;
    position: relative;
    overflow: hidden;
}

/* IMAGEM DE FUNDO DO SERTÃO (G.ITHUB) */
.bg-image {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: brightness(35%) contrast(125%);
    background-image: url('https://raw.githubusercontent.com/Welintons/wsinforcrato/main/77c47f9b19a16142691c7837c67f08c2.jpg');
    z-index: 0;
}

/* CAMADA ESCURA DE SOBREPOSIÇÃO */
.bg-overlay {
    position: absolute;
    inset: 0;
    background: rgba(11, 17, 32, 0.85);
    z-index: 1;
}

.container {
    text-align: center;
    padding: 30px;
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
    border-radius: 28px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #0f172a;
}

.logo-wrapper {
    width: 70px;
    height: 70px;
    margin: 0 auto 16px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(8, 145, 178, 0.3);
    border: 2px solid #0891b2;
}

.logo-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

h1 {
    font-size: 26px;
    margin: 0 0 4px;
    font-weight: 900;
    letter-spacing: -1px;
    color: #0891b2;
}

.subtitle {
    font-size: 10px;
    font-weight: 800;
    color: #d97706;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
}

p {
    color: #64748b;
    font-size: 13px;
    margin: 0;
}

.loader {
    width: 28px;
    height: 28px;
    margin: 24px auto 0;
    border: 3px solid #e2e8f0;
    border-top-color: #0891b2;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.error {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 12px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
    font-size: 12px;
    line-height: 1.4;
    text-align: left;
}

button {
    display: none;
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: #0891b2;
    color: white;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    transition: background .2s;
}

button:hover {
    background: #0e7490;
}
</style>
</head>

<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

<div class="container">

    <!-- LOGO REDONDINHO -->
    <div class="logo-wrapper">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsjJAn6tuhvX22Ni1tFV4QDjZRcdX1oFv1_HxQf6m03KKB429CdfW_oBc&s=10" alt="FaceCrato Logo">
    </div>

    <h1>FaceCrato</h1>
    <div class="subtitle">Cariri · Ceará</div>

    <p id="status">Preparando sua conexão...</p>

    <div class="loader" id="loader"></div>

    <div class="error" id="error"></div>

    <button id="retryButton" onclick="location.reload()">
        Tentar novamente
    </button>

</div>

<script type="module">

import { supabase } from "./supabase.js";

const status = document.getElementById("status");
const loader = document.getElementById("loader");
const errorBox = document.getElementById("error");
const retryButton = document.getElementById("retryButton");

let direcionando = false;

function mostrarErro(mensagem) {
    loader.style.display = "none";
    status.textContent = "Não foi possível continuar.";
    errorBox.textContent = mensagem;
    errorBox.style.display = "block";
    retryButton.style.display = "block";
}

async function iniciar() {
    try {
        status.textContent = "Verificando sua sessão...";

        // Cria uma promessa de timeout de 8 segundos para evitar travamentos
        const timeoutPromise = new Promise((_, reject) => 
            setTimeout(() => reject(new Error("O tempo limite de conexão foi excedido.")), 8000)
        );

        // Dispara o getSession competindo com o timeout
        const sessionPromise = supabase.auth.getSession();

        const { data, error } = await Promise.race([sessionPromise, timeoutPromise]);

        if (error) throw error;

        const destino = data.session ? "./feed.html" : "./login.html";

        direcionando = true;

        status.textContent = data.session ? "Bem-vindo de volta!" : "Vamos começar...";

        window.location.replace(destino);

    } catch (error) {
        console.error("Erro de inicialização:", error);

        mostrarErro(
            "Verifique sua conexão com a internet e tente novamente. " +
            (error.message ? `(${error.message})` : "")
        );
    }
}

iniciar();

// Mantém a sessão sincronizada caso ela mude em outra aba.
supabase.auth.onAuthStateChange((event, session) => {
    if (direcionando) return;

    if (event === "SIGNED_IN") {
        direcionando = true;
        window.location.replace("./feed.html");
    }

    if (event === "SIGNED_OUT") {
        direcionando = true;
        window.location.replace("./login.html");
    }
});

</script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
            .catch(error => console.error("Erro PWA:", error));
    });
}
</script>

</body>
</html>
