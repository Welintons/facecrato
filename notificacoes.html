<script type="module">
import { supabase } from "./supabase.js";

const list = document.getElementById("notificationList");
const counter = document.getElementById("counter");
const loadMoreArea = document.getElementById("loadMoreArea");

let currentUser = null;
let currentProfile = null;
let notifications = [];
let filter = "all";
let page = 0;
const PAGE_SIZE = 25;
let channel = null;
let loading = false;

// SISTEMA DE EFEITOS SONOROS (Web Audio API)
const soundFx = {
    ctx: null,
    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') { this.ctx.resume(); }
    },
    playPop() {
        try {
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.08);
        } catch(e) {}
    },
    playNotification() {
        try {
            this.init();
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.setValueAtTime(1318.51, now + 0.12);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        } catch(e) {}
    }
};

const menuToggleBtn = document.getElementById("menuToggleBtn");
const menuCloseBtn = document.getElementById("menuCloseBtn");
const mobileMenuDrawer = document.getElementById("mobileMenuDrawer");
const mobileMenuOverlay = document.getElementById("mobileMenuOverlay");

function toggleMobileMenu(open) {
    if (open) {
        mobileMenuOverlay.classList.remove("hidden");
        setTimeout(() => mobileMenuDrawer.classList.remove("translate-x-full"), 10);
    } else {
        mobileMenuDrawer.classList.add("translate-x-full");
        setTimeout(() => mobileMenuOverlay.classList.add("hidden"), 300);
    }
}
menuToggleBtn.addEventListener("click", () => toggleMobileMenu(true));
menuCloseBtn.addEventListener("click", () => toggleMobileMenu(false));
mobileMenuOverlay.addEventListener("click", () => toggleMobileMenu(false));

const typeLabels = {
  friend_request: "Solicitação de amizade",
  friend_accepted: "Amizade aceita",
  friendship_accepted: "Amizade aceita",
  reaction: "Reação na publicação",
  like: "Curtida",
  comment: "Novo comentário",
  share: "Compartilhamento",
  system: "Aviso do sistema"
};

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" })[char]);
}

function initials(name = "F") {
    return name.trim().split(/\s+/).slice(0,2).map(p => p[0] || "").join("").toUpperCase();
}

async function getStorageUrl(bucket, path) {
    if (!path) return null;
    if (/^https?:\/\//i.test(path)) return path;
    const { data } = await supabase.storage.from(bucket).createSignedUrl(path, 3600);
    return data?.signedUrl || null;
}

async function renderAvatar(profile, classes = "") {
    const name = profile?.full_name || profile?.username || "U";
    const avatarPath = profile?.avatar_url;
    if (avatarPath) {
        const avatarUrl = await getStorageUrl("avatars", avatarPath);
        if (avatarUrl) {
            return `<div class="${classes} overflow-hidden shrink-0"><img src="${escapeHTML(avatarUrl)}" alt="${escapeHTML(name)}" class="w-full h-full object-cover"></div>`;
        }
    }
    return `<div class="${classes} flex items-center justify-center font-bold shrink-0">${escapeHTML(initials(name))}</div>`;
}

function formatDate(date){
  const d = new Date(date);
  if(isNaN(d)) return "";
  return new Intl.DateTimeFormat("pt-BR",{ day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" }).format(d);
}

function getTarget(item){
  if(item.post_id) return `./feed.html?post=${encodeURIComponent(item.post_id)}`;
  if(item.actor_id && (item.notification_type === "friend_request" || item.notification_type === "friend_accepted")) return `./perfil.html?id=${encodeURIComponent(item.actor_id)}`;
  return null;
}

function render(){
  let filtered = notifications;
  if(filter === "unread") filtered = notifications.filter(n => !n.is_read);
  if(filter === "read") filtered = notifications.filter(n => n.is_read);

  const unreadCount = notifications.filter(n => !n.is_read).length;
  counter.textContent = `${notifications.length} notificações · ${unreadCount} não lidas`;
  document.getElementById("markAllBtn").style.display = unreadCount ? "block" : "none";

  if(!filtered.length){
    list.innerHTML = `
      <div class="p-12 text-center">
        <div class="w-16 h-16 rounded-2xl bg-cyan-50 border border-cyan-100 flex items-center justify-center mx-auto mb-4 text-cyan-600 shadow-xs">
          <i data-lucide="bell-off" class="w-7 h-7"></i>
        </div>
        <h3 class="font-bold text-slate-800 mb-1">Tudo calmo por aqui</h3>
        <p class="text-xs text-gray-500">Nenhuma notificação no momento.</p>
      </div>`;
    loadMoreArea.classList.add("hidden");
    lucide.createIcons();
    return;
  }

  list.innerHTML = filtered.map(item => {
    const readableType = typeLabels[item.notification_type] || "Notificação";
    const message = escapeHTML(item.message || "Nova atividade na sua rede");
    const date = formatDate(item.created_at);
    const unreadBg = !item.is_read ? "bg-cyan-50/50 border-l-4 border-cyan-600" : "";

    return `
      <article class="p-4 flex items-start gap-3.5 transition hover:bg-gray-50 ${unreadBg}" data-notification-id="${item.id}">
        <div class="w-10 h-10 rounded-xl bg-cyan-100 text-cyan-700 flex items-center justify-center shrink-0">
          <i data-lucide="bell" class="w-5 h-5"></i>
        </div>
        <div class="flex-1 min-w-0">
          <button class="text-left w-full cursor-pointer" onclick="openNotification('${item.id}')">
            <div class="flex items-center gap-2">
              <strong class="text-xs text-slate-900 font-bold">${escapeHTML(readableType)}</strong>
              ${!item.is_read ? '<span class="w-2 h-2 rounded-full bg-cyan-600 animate-pulse"></span>' : ""}
            </div>
            <p class="text-xs text-slate-700 mt-1 break-words leading-relaxed">${message}</p>
            <span class="text-[10px] text-gray-400 mt-1 block">${date}</span>
          </button>
          <div class="flex items-center gap-3 mt-2.5 pt-2 border-t border-gray-100">
            ${!item.is_read ? `<button onclick="markRead('${item.id}')" class="text-[11px] font-bold text-cyan-600 hover:underline">Marcar lida</button>` : ""}
            <button onclick="deleteNotification('${item.id}')" class="text-[11px] font-semibold text-gray-400 hover:text-red-600 ml-auto">Excluir</button>
          </div>
        </div>
      </article>`;
  }).join("");

  loadMoreArea.classList.toggle("hidden", notifications.length < PAGE_SIZE * (page + 1));
  lucide.createIcons();
}

async function loadNotifications(reset = true){
  if(loading || !currentUser) return;
  loading = true;
  if(reset) page = 0;

  const from = page * PAGE_SIZE;
  const to = from + PAGE_SIZE - 1;

  const {data, error} = await supabase
    .from("notifications")
    .select("*")
    .eq("recipient_id", currentUser.id)
    .order("created_at", { ascending: false })
    .range(from, to);

  loading = false;
  if(error) return;

  if(reset) notifications = data || [];
  else notifications.push(...(data || []));
  render();
}

async function loadMore(){
  if(loading) return;
  page++;
  await loadNotifications(false);
}

function setFilter(value){
  soundFx.playPop();
  filter = value;
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("text-cyan-700", "bg-cyan-50", "border-cyan-200", "font-bold");
    btn.classList.add("text-gray-600", "font-semibold");
  });
  const active = document.getElementById("filter-" + value);
  active.classList.remove("text-gray-600", "font-semibold");
  active.classList.add("text-cyan-700", "bg-cyan-50", "border-cyan-200", "font-bold");
  render();
}

window.markRead = async function(id){
  soundFx.playPop();
  await supabase.from("notifications").update({ is_read: true }).eq("id", id).eq("recipient_id", currentUser.id);
  notifications = notifications.map(n => n.id === id ? {...n, is_read: true} : n);
  render();
}

window.markAllRead = async function(){
  soundFx.playPop();
  await supabase.from("notifications").update({ is_read: true }).eq("recipient_id", currentUser.id).eq("is_read", false);
  notifications = notifications.map(n => ({...n, is_read: true}));
  render();
}

window.deleteNotification = async function(id){
  soundFx.playPop();
  await supabase.from("notifications").delete().eq("id", id).eq("recipient_id", currentUser.id);
  notifications = notifications.filter(n => n.id !== id);
  render();
}

window.openNotification = async function(id){
  soundFx.playPop();
  const item = notifications.find(n => n.id === id);
  if(!item) return;
  if(!item.is_read) await markRead(id);
  const target = getTarget(item);
  if(target) window.location.href = target;
}

// RESTAURAÇÃO DA INSCRIÇÃO SUPABASE REALTIME (Evitando duplicações e limpando canal anterior)
function subscribeNotifications() {
    if (!currentUser) return;

    if (channel) {
        supabase.removeChannel(channel);
        channel = null;
    }

    channel = supabase
        .channel(`facecrato-notifications-${currentUser.id}`)
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "notifications",
                filter: `recipient_id=eq.${currentUser.id}`
            },
            async (payload) => {
                soundFx.playNotification();
                await loadNotifications(true);
            }
        )
        .subscribe((status) => {
            if (status === "SUBSCRIBED") {
                console.log("Inscrito com sucesso no Realtime de notificações para o usuário:", currentUser.id);
            }
        });
}

// CORREÇÃO DA FUNÇÃO DO CLIMA (Open-Meteo API com tratamento de erros e interpretação de WMO weather_code)
async function fetchCaririWeather() {
    const container = document.getElementById("weatherWidget");
    if (!container) return;

    try {
        const response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=-7.2342&longitude=-39.4158&current=temperature_2m,weather_code", { cache: "no-cache" });
        if (!response.ok) {
            throw new Error(`Erro HTTP: ${response.status}`);
        }
        const data = await response.json();
        
        if (data && data.current) {
            const temp = Math.round(data.current.temperature_2m);
            const code = data.current.weather_code;
            
            let condition = "Ensolarado";
            if (code >= 1 && code <= 3) condition = "Parcialmente nublado";
            else if (code >= 45 && code <= 48) condition = "Nevoeiro";
            else if (code >= 51 && code <= 67) condition = "Chuvoso";
            else if (code >= 71 && code <= 77) condition = "Neve";
            else if (code >= 80 && code <= 82) condition = "Pancadas de chuva";
            else if (code >= 95) condition = "Tempestade";

            container.innerHTML = `
                <strong class="text-slate-900 block text-sm">${temp}°C · Crato - CE</strong>
                <span>${condition} no Cariri</span>
            `;
        } else {
            throw new Error("Dados meteorológicos indisponíveis");
        }
    } catch(e) {
        container.innerHTML = `
            <strong class="text-slate-900 block text-sm">29°C · Crato - CE</strong>
            <span>Ensolarado no Cariri</span>
        `;
    }
}

async function init(){
  const {data, error} = await supabase.auth.getSession();
  if(error || !data.session){ window.location.replace("./login.html"); return; }
  currentUser = data.session.user;

  const { data: profile } = await supabase.from("profiles").select("id,username,full_name,avatar_url").eq("id", currentUser.id).maybeSingle();
  currentProfile = profile || { id: currentUser.id, username: currentUser.email?.split("@")[0] || "usuario", full_name: currentUser.email?.split("@")[0] || "Usuário" };

  document.getElementById("sideName").textContent = currentProfile.full_name || "Usuário";
  document.getElementById("sideUsername").textContent = "@" + (currentProfile.username || "usuario");
  document.getElementById("sideAvatar").innerHTML = await renderAvatar(currentProfile, "w-full h-full rounded-full");

  document.getElementById("mobileMenuName").textContent = currentProfile.full_name || "Usuário";
  document.getElementById("mobileMenuUsername").textContent = "@" + (currentProfile.username || "usuario");
  document.getElementById("mobileMenuAvatar").innerHTML = await renderAvatar(currentProfile, "w-full h-full rounded-full");

  await loadNotifications(true);
  subscribeNotifications();
  fetchCaririWeather();
  lucide.createIcons();
}

document.getElementById("profileButton").addEventListener("click", () => window.location.href = "./perfil.html");
document.getElementById("notificationsButton").addEventListener("click", () => window.location.href = "./notificacoes.html");

const handleLogout = async () => {
    const confirm = await Swal.fire({ title:"Sair da conta?", icon:"question", showCancelButton:true, confirmButtonColor:"#0891b2" });
    if (confirm.isConfirmed) { 
        if (channel) {
            supabase.removeChannel(channel);
        }
        await supabase.auth.signOut(); 
        window.location.replace("./login.html"); 
    }
};
document.getElementById("logoutButtonMobile").addEventListener("click", handleLogout);

init();
</script>

</body>
</html>
