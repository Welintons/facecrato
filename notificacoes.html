<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f8fafc;

    <!-- CONTEÚDO CENTRAL (Notificações) -->

</main>

<!-- MENU MOBILE DESLIZANTE -->
<div id="mobileMenuOverlay" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden lg:hidden transition-opacity"></div>

        <button class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-slate-900 font-semibold text-sm transition" data-nav="friends"><i data-lucide="users" class="w-4 h-4"></i> Amigos</button>

        <button class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-slate-900 font-semibold text-sm transition" data-nav="profile"><i data-lucide="user-round" class="w-4 h-4"></i> Meu perfil</button>
    </nav>

    <div class="mt-auto pt-4 border-t border-gray-100">
        <button class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-red-600 bg-red-50 font-semibold text-sm transition" id="logoutButtonMobile"><i data-lucide="log-out" class="w-5 h-5"></i> Sair da conta</button>
    </div>
</div>

<script type="module">
import { supabase } from "./supabase.js";

const list = document.getElementById("notificationList");
const counter = document.getElementById("counter");
const loadMoreArea = document.getElementById("loadMoreArea");

let currentUser = null;
let currentProfile = null;
let notifications = [];
let filter = "all";
let page = 0;
const PAGE_SIZE = 25;
let channel = null;
let loading = false;

// SISTEMA DE EFEITOS SONOROS (Web Audio API)
const soundFx = {
    ctx: null,
    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') { this.ctx.resume(); }
    },
    playPop() {
        try {
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.08);
        } catch(e) {}
    }
};

// Controle do Menu Sanduíche Mobile
const menuToggleBtn = document.getElementById("menuToggleBtn");
const menuCloseBtn = document.getElementById("menuCloseBtn");
const mobileMenuDrawer = document.getElementById("mobileMenuDrawer");
const mobileMenuOverlay = document.getElementById("mobileMenuOverlay");

function toggleMobileMenu(open) {
    if (open) {
        mobileMenuOverlay.classList.remove("hidden");
        setTimeout(() => mobileMenuDrawer.classList.remove("translate-x-full"), 10);
    } else {
        mobileMenuDrawer.classList.add("translate-x-full");
        setTimeout(() => mobileMenuOverlay.classList.add("hidden"), 300);
    }
}

menuToggleBtn.addEventListener("click", () => toggleMobileMenu(true));
menuCloseBtn.addEventListener("click", () => toggleMobileMenu(false));
mobileMenuOverlay.addEventListener("click", () => toggleMobileMenu(false));

const icons = {
  friend_request: ["user-plus","bg-cyan-50 text-cyan-700"],
  friend_accepted: ["users","bg-emerald-50 text-emerald-700"],
  friendship_accepted: ["users","bg-emerald-50 text-emerald-700"],
  reaction: ["heart","bg-pink-50 text-pink-700"],
  like: ["thumbs-up","bg-pink-50 text-pink-700"],
  comment: ["message-circle","bg-violet-50 text-violet-700"],
  share: ["share-2","bg-cyan-50 text-cyan-700"],
  system: ["bell","bg-amber-50 text-amber-700"]
};

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function initials(name = "F") {
    return name.trim().split(/\s+/).slice(0,2).map(p => p[0] || "").join("").toUpperCase();
}

function renderAvatar(profile, classes = "") {
    const name = profile?.full_name || profile?.username || "U";
    const avatar = profile?.avatar_url;

    if (avatar && /^https?:\/\//i.test(avatar)) {
        return `
            <div class="${classes} overflow-hidden">
                <img src="${escapeHTML(avatar)}"
                     alt="${escapeHTML(name)}"
                     class="w-full h-full object-cover">
            </div>
        `;
    }

    return `
        <div class="${classes}">
            ${escapeHTML(initials(name))}
        </div>
    `;
}

function getIcon(type){
  return icons[type] || icons.system;
}

function formatDate(date){
  const d = new Date(date);
  if(isNaN(d)) return "";

  return new Intl.DateTimeFormat("pt-BR",{
    day:"2-digit",
    month:"short",
    hour:"2-digit",
    minute:"2-digit"
  }).format(d);
}

function getTarget(item){
  if(item.post_id){
    return `./feed.html?post=${encodeURIComponent(item.post_id)}`;
  }

  if(item.actor_id && (
    item.notification_type === "friend_request" ||
    item.notification_type === "friend_accepted"
  )){
    return `./perfil.html?id=${encodeURIComponent(item.actor_id)}`;
  }

  return null;
}

function render(){
  let filtered = notifications;

  if(filter === "unread"){
    filtered = notifications.filter(n => !n.is_read);
  }

  if(filter === "read"){
    filtered = notifications.filter(n => n.is_read);
  }

  const unreadCount = notifications.filter(n => !n.is_read).length;

  counter.textContent =
    `${notifications.length} notificações · ${unreadCount} não lidas`;

  document.getElementById("markAllBtn").style.display =
    unreadCount ? "block" : "none";

  if(!filtered.length){
    list.innerHTML = `
      <div class="p-12 text-center">
        <div class="w-16 h-16 rounded-2xl bg-gray-100 flex items-center justify-center mx-auto mb-4 border border-gray-200">
          <i data-lucide="bell-off" class="w-7 h-7 text-gray-400"></i>
        </div>
        <h3 class="font-bold text-slate-800 mb-1">Nada por aqui</h3>
        <p class="text-xs text-gray-500">
          ${filter === "unread" ? "Você não tem notificações pendentes." :
          filter === "read" ? "Você ainda não tem notificações lidas." :
          "Suas notificações aparecerão aqui."}
        </p>
      </div>`;

    loadMoreArea.classList.add("hidden");
    lucide.createIcons();
    return;
  }

  list.innerHTML = filtered.map(item => {
    const [icon,color] = getIcon(item.notification_type);
    const target = getTarget(item);
    const message = escapeHTML(item.message || "Nova atividade");
    const date = formatDate(item.created_at);

    return `
      <article class="notification ${!item.is_read ? "unread" : ""}
        flex items-start gap-3.5 p-4 border-b border-gray-100">

        <div class="icon-box ${color}">
          <i data-lucide="${icon}" class="w-5 h-5"></i>
        </div>

        <div class="flex-1 min-w-0">
          <button class="text-left w-full cursor-pointer"
            onclick="openNotification('${item.id}')">

            <div class="flex items-center gap-2">
              <strong class="text-sm text-slate-900 capitalize">
                ${escapeHTML(item.notification_type.replace(/_/g," "))}
              </strong>
              ${!item.is_read ?
                '<span class="w-2 h-2 rounded-full bg-cyan-600"></span>' : ""}
            </div>

            <p class="text-xs text-slate-700 mt-1 break-words leading-relaxed">${message}</p>
            <span class="text-[11px] text-gray-400 mt-1.5 block">${date}</span>
          </button>

          <div class="flex items-center gap-4 mt-3">

            ${!item.is_read ? `
              <button onclick="markRead('${item.id}')"
                class="text-xs font-semibold text-cyan-600 hover:underline">
                Marcar como lida
              </button>` : ""}

            ${target ? `
              <button onclick="goToNotification('${item.id}')"
                class="text-xs font-semibold text-gray-500 hover:text-slate-900">
                Ver
              </button>` : ""}

            <button onclick="deleteNotification('${item.id}')"
              class="text-xs font-semibold text-gray-400 hover:text-red-600">
              Excluir
            </button>

          </div>
        </div>
      </article>`;
  }).join("");

  loadMoreArea.classList.toggle(
    "hidden",
    notifications.length < PAGE_SIZE * (page + 1)
  );

  lucide.createIcons();
}

async function loadNotifications(reset = true){
  if(loading || !currentUser) return;

  loading = true;

  if(reset) page = 0;

  const from = page * PAGE_SIZE;
  const to = from + PAGE_SIZE - 1;

  const {data,error} = await supabase
    .from("notifications")
    .select("*")
    .eq("recipient_id",currentUser.id)
    .order("created_at",{ascending:false})
    .range(from,to);

  loading = false;

  if(error){
    console.error(error);
    list.innerHTML = `
      <div class="p-8 text-center text-red-500 text-xs">
        Não foi possível carregar as notificações.
        <p class="text-[11px] text-gray-400 mt-2">
          ${escapeHTML(error.message)}
        </p>
      </div>`;
    return;
  }

  if(reset) notifications = data || [];
  else notifications.push(...(data || []));

  render();
}

async function loadMore(){
  if(loading) return;

  page++;
  await loadNotifications(false);
}

function setFilter(value){
  soundFx.playPop();
  filter = value;

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("text-cyan-700","bg-cyan-50","border-cyan-200","font-bold");
    btn.classList.add("text-gray-500","font-semibold");
  });

  const active = document.getElementById("filter-" + value);
  active.classList.remove("text-gray-500","font-semibold");
  active.classList.add("text-cyan-700","bg-cyan-50","border-cyan-200","font-bold");

  render();
}

async function markRead(id){
  soundFx.playPop();
  const {error} = await supabase
    .from("notifications")
    .update({is_read:true})
    .eq("id",id)
    .eq("recipient_id",currentUser.id);

  if(error){
    Swal.fire("Erro",error.message,"error");
    return false;
  }

  notifications = notifications.map(n =>
    n.id === id ? {...n,is_read:true} : n
  );

  render();
  return true;
}

async function markAllRead(){
  soundFx.playPop();
  const {error} = await supabase
    .from("notifications")
    .update({is_read:true})
    .eq("recipient_id",currentUser.id)
    .eq("is_read",false);

  if(error){
    Swal.fire("Erro",error.message,"error");
    return;
  }

  notifications = notifications.map(n => ({...n,is_read:true}));
  render();
}

async function deleteNotification(id){
  soundFx.playPop();
  const result = await Swal.fire({
    title:"Excluir notificação?",
    text:"Essa ação não pode ser desfeita.",
    icon:"warning",
    showCancelButton:true,
    confirmButtonText:"Excluir",
    cancelButtonText:"Cancelar",
    confirmButtonColor:"#dc2626"
  });

  if(!result.isConfirmed) return;

  const {error} = await supabase
    .from("notifications")
    .delete()
    .eq("id",id)
    .eq("recipient_id",currentUser.id);

  if(error){
    Swal.fire("Erro",error.message,"error");
    return;
  }

  notifications = notifications.filter(n => n.id !== id);
  render();
}

async function openNotification(id){
  soundFx.playPop();
  const item = notifications.find(n => n.id === id);
  if(!item) return;

  if(!item.is_read){
    const success = await markRead(id);
    if(!success) return;
  }

  const target = getTarget(item);
  if(target) window.location.href = target;
}

async function goToNotification(id){
  await openNotification(id);
}

function subscribeNotifications(){
  if(channel) supabase.removeChannel(channel);

  channel = supabase
    .channel("facecrato-notifications-" + currentUser.id)
    .on("postgres_changes",{
      event:"*",
      schema:"public",
      table:"notifications",
      filter:"recipient_id=eq." + currentUser.id
    },async () => {
      await loadNotifications();
    })
    .subscribe();
}

// BUSCAR CLIMA DO CARIRI (Open-Meteo API - Crato/CE: -7.2342, -39.4158)
async function fetchCaririWeather() {
    const weatherContainer = document.getElementById("weatherWidget");
    try {
        const response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=-7.2342&longitude=-39.4158&current=temperature_2m,weather_code");
        const data = await response.json();
        
        if (data && data.current) {
            const temp = Math.round(data.current.temperature_2m);
            const code = data.current.weather_code;
            
            // Descrição simples baseada no código WMO
            let condition = "Ensolarado";
            let iconName = "sun";
            let colorClass = "text-amber-500 bg-amber-50";

            if (code >= 1 && code <= 3) { condition = "Parcialmente nublado"; iconName = "cloud-sun"; colorClass = "text-cyan-600 bg-cyan-50"; }
            else if (code >= 51 && code <= 67) { condition = "Chuvoso"; iconName = "cloud-rain"; colorClass = "text-blue-600 bg-blue-50"; }
            else if (code >= 95) { condition = "Tempestade"; iconName = "cloud-lightning"; colorClass = "text-purple-600 bg-purple-50"; }

            weatherContainer.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl ${colorClass} flex items-center justify-center shrink-0">
                        <i data-lucide="${iconName}" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <strong class="text-slate-900 block text-sm">${temp}°C · ${condition}</strong>
                        <span class="text-[11px] text-gray-500">Crato - Ceará</span>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }
    } catch (e) {
        weatherContainer.innerHTML = `<span class="text-[11px] text-gray-400">Clima indisponível no momento.</span>`;
    }
}

async function init(){
  const {data,error} = await supabase.auth.getSession();

  if(error || !data.session){
    window.location.replace("./login.html");
    return;
  }

  currentUser = data.session.user;

  const { data: profile } = await supabase.from("profiles").select("id,username,full_name,avatar_url").eq("id", currentUser.id).maybeSingle();
  currentProfile = profile || { id: currentUser.id, username: currentUser.email?.split("@")[0] || "usuario", full_name: currentUser.email?.split("@")[0] || "Usuário" };

  document.getElementById("sideName").textContent = currentProfile.full_name || "Usuário";
  document.getElementById("sideUsername").textContent = "@" + (currentProfile.username || "usuario");

  document.getElementById("sideAvatar").innerHTML =
      renderAvatar(currentProfile, "w-full h-full rounded-full flex items-center justify-center");

  await loadNotifications();
  subscribeNotifications();
  fetchCaririWeather();
}

// Navegação global dos botões
document.querySelectorAll("[data-nav]").forEach(btn => {
    btn.addEventListener("click", () => {
        soundFx.playPop();
        const destinations = { feed:"./feed.html", friends:"./amigos.html", notifications:"./notificacoes.html", profile:"./perfil.html" };
        if (destinations[btn.dataset.nav]) window.location.href = destinations[btn.dataset.nav];
    });
});

document.getElementById("profileButton").addEventListener("click", () => { soundFx.playPop(); window.location.href = "./perfil.html"; });
document.getElementById("notificationsButton").addEventListener("click", () => { soundFx.playPop(); window.location.href = "./notificacoes.html"; });

const handleLogout = async () => {
    soundFx.playPop();
    const confirm = await Swal.fire({ title:"Sair da conta?", icon:"question", showCancelButton:true, confirmButtonColor:"#0891b2" });
    if (confirm.isConfirmed) { await supabase.auth.signOut(); window.location.replace("./login.html"); }
};

document.getElementById("logoutButton").addEventListener("click", handleLogout);
document.getElementById("logoutButtonMobile").addEventListener("click", handleLogout);

window.setFilter = setFilter;
window.loadNotifications = loadNotifications;
window.loadMore = loadMore;
window.markRead = markRead;
window.markAllRead = markAllRead;
window.deleteNotification = deleteNotification;
window.openNotification = openNotification;
window.goToNotification = goToNotification;

init();
</script>
