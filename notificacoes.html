
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Notificações | FaceCrato</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080d18;
  color:#f1f5f9;
  font-family:Arial,sans-serif;
}
.glass{
  background:rgba(17,24,39,.88);
  border:1px solid rgba(148,163,184,.12);
}
.notification{transition:.2s}
.notification:hover{background:rgba(59,130,246,.07)}
.unread{
  border-left:3px solid #3b82f6;
  background:rgba(59,130,246,.055);
}
.icon-box{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  border-radius:14px;flex-shrink:0;
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:10px}
</style>
</head>

<body class="min-h-screen">

<header class="sticky top-0 z-40 glass">
  <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button onclick="history.back()" class="p-2 rounded-xl hover:bg-slate-800">
        <i data-lucide="arrow-left"></i>
      </button>
      <div>
        <h1 class="text-xl font-bold">Notificações</h1>
        <p class="text-xs text-slate-400">Tudo que acontece na sua rede</p>
      </div>
    </div>

    <button onclick="markAllRead()" id="markAllBtn"
      class="text-xs font-semibold text-blue-400 hover:text-blue-300">
      Marcar todas como lidas
    </button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-6">

<section class="grid grid-cols-3 gap-2 mb-5">
  <button onclick="setFilter('all')" id="filter-all"
    class="filter-btn rounded-xl p-3 glass text-sm font-semibold text-blue-400">
    Todas
  </button>
  <button onclick="setFilter('unread')" id="filter-unread"
    class="filter-btn rounded-xl p-3 glass text-sm font-semibold text-slate-400">
    Não lidas
  </button>
  <button onclick="setFilter('read')" id="filter-read"
    class="filter-btn rounded-xl p-3 glass text-sm font-semibold text-slate-400">
    Lidas
  </button>
</section>

<section class="glass rounded-2xl overflow-hidden">
  <div class="flex justify-between items-center p-4 border-b border-slate-800">
    <div>
      <h2 class="font-bold">Suas atividades</h2>
      <p class="text-xs text-slate-400" id="counter">Carregando...</p>
    </div>
    <button onclick="loadNotifications()" class="p-2 rounded-lg hover:bg-slate-800"
      title="Atualizar">
      <i data-lucide="refresh-cw" class="w-4 h-4"></i>
    </button>
  </div>

  <div id="notificationList">
    <div class="p-10 text-center text-slate-400">
      Carregando notificações...
    </div>
  </div>

  <div id="loadMoreArea" class="hidden p-4 border-t border-slate-800 text-center">
    <button onclick="loadMore()" class="text-sm text-blue-400 font-semibold">
      Carregar mais
    </button>
  </div>
</section>

</main>

<script type="module">
import { supabase } from "./supabase.js";

const list = document.getElementById("notificationList");
const counter = document.getElementById("counter");
const loadMoreArea = document.getElementById("loadMoreArea");

let currentUser = null;
let notifications = [];
let filter = "all";
let page = 0;
const PAGE_SIZE = 25;
let channel = null;
let loading = false;

const icons = {
  friend_request: ["user-plus","bg-blue-500/15 text-blue-400"],
  friend_accepted: ["users","bg-green-500/15 text-green-400"],
  friendship_accepted: ["users","bg-green-500/15 text-green-400"],
  reaction: ["heart","bg-pink-500/15 text-pink-400"],
  like: ["thumbs-up","bg-pink-500/15 text-pink-400"],
  comment: ["message-circle","bg-purple-500/15 text-purple-400"],
  share: ["share-2","bg-cyan-500/15 text-cyan-400"],
  system: ["bell","bg-amber-500/15 text-amber-400"]
};

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function getIcon(type){
  return icons[type] || icons.system;
}

function formatDate(date){
  const d = new Date(date);
  if(isNaN(d)) return "";

  return new Intl.DateTimeFormat("pt-BR",{
    day:"2-digit",
    month:"short",
    hour:"2-digit",
    minute:"2-digit"
  }).format(d);
}

function getTarget(item){
  if(item.post_id){
    return `./feed.html?post=${encodeURIComponent(item.post_id)}`;
  }

  if(item.actor_id && (
    item.notification_type === "friend_request" ||
    item.notification_type === "friend_accepted"
  )){
    return `./perfil.html?id=${encodeURIComponent(item.actor_id)}`;
  }

  return null;
}

function render(){
  let filtered = notifications;

  if(filter === "unread"){
    filtered = notifications.filter(n => !n.is_read);
  }

  if(filter === "read"){
    filtered = notifications.filter(n => n.is_read);
  }

  const unreadCount = notifications.filter(n => !n.is_read).length;

  counter.textContent =
    `${notifications.length} notificações · ${unreadCount} não lidas`;

  document.getElementById("markAllBtn").style.display =
    unreadCount ? "block" : "none";

  if(!filtered.length){
    list.innerHTML = `
      <div class="p-12 text-center">
        <div class="w-16 h-16 rounded-2xl bg-slate-800 flex items-center justify-center mx-auto mb-4">
          <i data-lucide="bell-off" class="w-7 h-7 text-slate-500"></i>
        </div>
        <h3 class="font-bold mb-1">Nada por aqui</h3>
        <p class="text-sm text-slate-400">
          ${filter === "unread" ? "Você não tem notificações pendentes." :
          filter === "read" ? "Você ainda não tem notificações lidas." :
          "Suas notificações aparecerão aqui."}
        </p>
      </div>`;

    loadMoreArea.classList.add("hidden");
    lucide.createIcons();
    return;
  }

  list.innerHTML = filtered.map(item => {
    const [icon,color] = getIcon(item.notification_type);
    const target = getTarget(item);
    const message = escapeHTML(item.message || "Nova atividade");
    const date = formatDate(item.created_at);

    return `
      <article class="notification ${!item.is_read ? "unread" : ""}
        flex items-start gap-3 p-4 border-b border-slate-800/70">

        <div class="icon-box ${color}">
          <i data-lucide="${icon}" class="w-5 h-5"></i>
        </div>

        <div class="flex-1 min-w-0">
          <button class="text-left w-full"
            onclick="openNotification('${item.id}')">

            <div class="flex items-center gap-2">
              <strong class="text-sm">
                ${escapeHTML(item.notification_type.replace(/_/g," "))}
              </strong>
              ${!item.is_read ?
                '<span class="w-2 h-2 rounded-full bg-blue-500"></span>' : ""}
            </div>

            <p class="text-sm text-slate-300 mt-1 break-words">${message}</p>
            <span class="text-xs text-slate-500 mt-2 block">${date}</span>
          </button>

          <div class="flex items-center gap-4 mt-3">

            ${!item.is_read ? `
              <button onclick="markRead('${item.id}')"
                class="text-xs text-blue-400">
                Marcar como lida
              </button>` : ""}

            ${target ? `
              <button onclick="goToNotification('${item.id}')"
                class="text-xs text-slate-400 hover:text-white">
                Ver
              </button>` : ""}

            <button onclick="deleteNotification('${item.id}')"
              class="text-xs text-slate-500 hover:text-red-400">
              Excluir
            </button>

          </div>
        </div>
      </article>`;
  }).join("");

  loadMoreArea.classList.toggle(
    "hidden",
    notifications.length < PAGE_SIZE * (page + 1)
  );

  lucide.createIcons();
}

async function loadNotifications(reset = true){
  if(loading || !currentUser) return;

  loading = true;

  if(reset) page = 0;

  const from = page * PAGE_SIZE;
  const to = from + PAGE_SIZE - 1;

  const {data,error} = await supabase
    .from("notifications")
    .select("*")
    .eq("recipient_id",currentUser.id)
    .order("created_at",{ascending:false})
    .range(from,to);

  loading = false;

  if(error){
    console.error(error);
    list.innerHTML = `
      <div class="p-8 text-center text-red-400">
        Não foi possível carregar as notificações.
        <p class="text-xs text-slate-500 mt-2">
          ${escapeHTML(error.message)}
        </p>
      </div>`;
    return;
  }

  if(reset) notifications = data || [];
  else notifications.push(...(data || []));

  render();
}

async function loadMore(){
  if(loading) return;

  page++;
  await loadNotifications(false);
}

function setFilter(value){
  filter = value;

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("text-blue-400","border-blue-500");
    btn.classList.add("text-slate-400");
  });

  const active = document.getElementById("filter-" + value);
  active.classList.remove("text-slate-400");
  active.classList.add("text-blue-400","border-blue-500");

  render();
}

async function markRead(id){
  const {error} = await supabase
    .from("notifications")
    .update({is_read:true})
    .eq("id",id)
    .eq("recipient_id",currentUser.id);

  if(error){
    Swal.fire("Erro",error.message,"error");
    return false;
  }

  notifications = notifications.map(n =>
    n.id === id ? {...n,is_read:true} : n
  );

  render();
  return true;
}

async function markAllRead(){
  const {error} = await supabase
    .from("notifications")
    .update({is_read:true})
    .eq("recipient_id",currentUser.id)
    .eq("is_read",false);

  if(error){
    Swal.fire("Erro",error.message,"error");
    return;
  }

  notifications = notifications.map(n => ({...n,is_read:true}));
  render();
}

async function deleteNotification(id){
  const result = await Swal.fire({
    title:"Excluir notificação?",
    text:"Essa ação não pode ser desfeita.",
    icon:"warning",
    showCancelButton:true,
    confirmButtonText:"Excluir",
    cancelButtonText:"Cancelar",
    background:"#111827",
    color:"#fff",
    confirmButtonColor:"#dc2626"
  });

  if(!result.isConfirmed) return;

  const {error} = await supabase
    .from("notifications")
    .delete()
    .eq("id",id)
    .eq("recipient_id",currentUser.id);

  if(error){
    Swal.fire("Erro",error.message,"error");
    return;
  }

  notifications = notifications.filter(n => n.id !== id);
  render();
}

async function openNotification(id){
  const item = notifications.find(n => n.id === id);
  if(!item) return;

  if(!item.is_read){
    const success = await markRead(id);
    if(!success) return;
  }

  const target = getTarget(item);
  if(target) window.location.href = target;
}

async function goToNotification(id){
  await openNotification(id);
}

function subscribeNotifications(){
  if(channel) supabase.removeChannel(channel);

  channel = supabase
    .channel("facecrato-notifications-" + currentUser.id)
    .on("postgres_changes",{
      event:"*",
      schema:"public",
      table:"notifications",
      filter:"recipient_id=eq." + currentUser.id
    },async () => {
      await loadNotifications();
    })
    .subscribe();
}

async function init(){
  const {data,error} = await supabase.auth.getSession();

  if(error || !data.session){
    window.location.href = "./login.html";
    return;
  }

  currentUser = data.session.user;

  await loadNotifications();
  subscribeNotifications();
}

window.setFilter = setFilter;
window.loadNotifications = loadNotifications;
window.loadMore = loadMore;
window.markRead = markRead;
window.markAllRead = markAllRead;
window.deleteNotification = deleteNotification;
window.openNotification = openNotification;
window.goToNotification = goToNotification;

init();
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./service-worker.js")
      .catch(error=>console.error("PWA:",error));
  });
}
</script>

</body>
</html>
