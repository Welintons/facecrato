
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">

<title>Perfil | FaceCrato</title>

<link rel="manifest" href="./manifest.json">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#0b1120;
    color:#f1f5f9;
    font-family:Inter,system-ui,sans-serif;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

:root{
    --panel:#111c2e;
    --panel2:#17243a;
    --border:#26364f;
    --muted:#94a3b8;
    --blue:#3b82f6;
}

.topbar{
    height:66px;
    position:sticky;
    top:0;
    z-index:50;
    background:#0b1120ed;
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
}

.topbar-inner{
    max-width:1150px;
    height:100%;
    margin:auto;
    padding:0 20px;
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:950;
    letter-spacing:-1px;
}

.logo-mark{
    width:37px;
    height:37px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#2563eb,#6366f1);
    color:white;
}

.top-actions{
    margin-left:auto;
    display:flex;
    gap:9px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel);
    color:#cbd5e1;
    display:grid;
    place-items:center;
}

.icon-btn svg{width:19px}

.page{
    max-width:950px;
    padding:25px 16px 100px;
    margin:auto;
}

.panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
}

.cover{
    height:260px;
    position:relative;
    border-radius:17px 17px 0 0;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 20%,#2563eb99,transparent 40%),
        radial-gradient(circle at 80% 70%,#7c3aed88,transparent 45%),
        #17243a;
    background-size:cover;
    background-position:center;
}

.cover::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(transparent 55%,#0b112055);
    pointer-events:none;
}

.cover-edit{
    position:absolute;
    right:16px;
    top:16px;
    z-index:2;
}

.profile-info{
    padding:0 25px 22px;
}

.profile-main{
    display:flex;
    align-items:flex-end;
    gap:18px;
    margin-top:-62px;
    position:relative;
    z-index:3;
}

.avatar-wrap{
    width:130px;
    height:130px;
    border:5px solid var(--panel);
    border-radius:50%;
    position:relative;
    flex-shrink:0;
    background:linear-gradient(135deg,#2563eb,#8b5cf6);
}

.avatar-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
}

.avatar-placeholder{
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    font-size:40px;
    font-weight:900;
}

.avatar-edit{
    position:absolute;
    right:0;
    bottom:3px;
    z-index:4;
    width:35px;
    height:35px;
    border-radius:50%;
    border:3px solid var(--panel);
    background:#263d61;
    color:white;
    display:grid;
    place-items:center;
}

.avatar-edit svg{width:15px}

.identity{
    padding-bottom:9px;
    min-width:0;
    flex:1;
}

.identity h1{
    font-size:25px;
    font-weight:950;
    letter-spacing:-1px;
    margin:0;
    overflow-wrap:anywhere;
}

.identity p{
    color:var(--muted);
    font-size:13px;
    margin:5px 0 0;
}

.profile-bio{
    color:#cbd5e1;
    font-size:14px;
    line-height:1.65;
    margin:18px 0 12px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.profile-meta{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    color:var(--muted);
    font-size:12px;
}

.profile-meta span{
    display:flex;
    align-items:center;
    gap:6px;
}

.profile-meta svg{width:15px}

.profile-actions{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:19px;
}

.btn{
    border:1px solid var(--border);
    background:#17243a;
    color:#dbeafe;
    padding:10px 15px;
    border-radius:10px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:12px;
    font-weight:800;
}

.btn svg{width:16px}

.btn-primary{
    background:linear-gradient(100deg,#2563eb,#4f46e5);
    border:0;
    color:white;
}

.btn-danger{
    color:#fca5a5;
}

.btn:hover{filter:brightness(1.12)}

.section-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:24px 0 13px;
}

.section-heading h2{
    font-size:18px;
    font-weight:900;
    margin:0;
}

.posts-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
}

.post{
    padding:17px;
}

.post-header{
    display:flex;
    align-items:center;
    gap:10px;
}

.post-avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#2563eb,#8b5cf6);
    font-size:13px;
    font-weight:900;
}

.post-author{
    flex:1;
    min-width:0;
}

.post-author strong{
    display:block;
    font-size:13px;
}

.post-author small{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.post-content{
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    font-size:14px;
    line-height:1.7;
    margin:16px 0;
}

.post-media{
    display:block;
    width:100%;
    max-height:450px;
    object-fit:contain;
    background:#080d18;
    border-radius:12px;
    margin-top:12px;
}

.post-footer{
    border-top:1px solid var(--border);
    padding-top:12px;
    margin-top:13px;
    color:var(--muted);
    font-size:11px;
}

.empty-state{
    padding:45px 20px;
    text-align:center;
    color:var(--muted);
}

.empty-state svg{
    width:35px;
    height:35px;
    margin:0 auto 12px;
}

.empty-state strong{
    display:block;
    color:#cbd5e1;
    margin-bottom:7px;
}

.empty-state p{
    font-size:12px;
    line-height:1.6;
}

.loading{
    padding:35px;
    text-align:center;
    color:var(--muted);
}

.spinner{
    width:25px;
    height:25px;
    border:3px solid #26364f;
    border-top-color:#3b82f6;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{to{transform:rotate(360deg)}}

.modal-backdrop{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#020617bb;
    backdrop-filter:blur(5px);
    padding:20px;
    align-items:center;
    justify-content:center;
}

.modal-backdrop.show{display:flex}

.modal{
    width:100%;
    max-width:480px;
    max-height:90vh;
    overflow:auto;
    padding:22px;
    background:#111c2e;
    border:1px solid var(--border);
    border-radius:18px;
}

.modal h2{
    margin:0 0 20px;
    font-size:20px;
    font-weight:900;
}

.field{margin-bottom:15px}

.field label{
    display:block;
    font-size:12px;
    font-weight:750;
    color:#cbd5e1;
    margin-bottom:7px;
}

.field input,.field textarea,.field select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    outline:none;
    background:#17243a;
    color:white;
    font-size:13px;
}

.field textarea{
    min-height:95px;
    resize:vertical;
}

.field input:focus,.field textarea:focus{
    border-color:#3b82f6;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:9px;
    margin-top:20px;
}

.mobile-nav{display:none}

@media(max-width:650px){

    .topbar-inner{padding:0 13px}
    .logo{font-size:19px}

    .page{
        padding:14px 10px 100px;
    }

    .cover{height:190px}

    .profile-info{padding:0 15px 18px}

    .profile-main{
        align-items:flex-end;
        gap:10px;
        margin-top:-48px;
    }

    .avatar-wrap{
        width:100px;
        height:100px;
        border-width:4px;
    }

    .avatar-placeholder{font-size:31px}

    .identity h1{font-size:20px}

    .identity p{font-size:11px}

    .profile-actions .btn{
        flex:1;
    }

    .mobile-nav{
        position:fixed;
        bottom:0;
        left:0;
        right:0;
        z-index:60;
        display:flex;
        justify-content:space-around;
        padding:10px 8px calc(10px + env(safe-area-inset-bottom));
        background:#101a2bed;
        border-top:1px solid var(--border);
        backdrop-filter:blur(15px);
    }

    .mobile-nav button{
        border:0;
        background:none;
        color:#94a3b8;
        display:grid;
        justify-items:center;
        gap:4px;
        font-size:10px;
    }

    .mobile-nav svg{width:20px;height:20px}
}
</style>
</head>

<body>

<header class="topbar">
    <div class="topbar-inner">

        <div class="logo">
            <div class="logo-mark">F</div>
            FaceCrato
        </div>

        <div class="top-actions">

            <button class="icon-btn" onclick="location.href='./feed.html'" title="Feed">
                <i data-lucide="house"></i>
            </button>

            <button class="icon-btn" onclick="location.href='./notificacoes.html'" title="Notificações">
                <i data-lucide="bell"></i>
            </button>

            <button class="icon-btn" id="logoutButton" title="Sair">
                <i data-lucide="log-out"></i>
            </button>

        </div>
    </div>
</header>

<main class="page">

    <section class="panel">

        <!-- CAPA -->
        <div class="cover" id="cover">

            <button class="btn cover-edit" id="changeCoverButton" hidden>
                <i data-lucide="camera"></i>
                Alterar capa
            </button>

        </div>

        <div class="profile-info">

            <div class="profile-main">

                <div class="avatar-wrap">

                    <div class="avatar-placeholder" id="avatarPlaceholder">
                        F
                    </div>

                    <img id="avatarImage" alt="Foto de perfil" hidden>

                    <button class="avatar-edit" id="changeAvatarButton" hidden title="Alterar foto">
                        <i data-lucide="camera"></i>
                    </button>

                </div>

                <div class="identity">

                    <h1 id="profileName">Carregando perfil...</h1>
                    <p id="profileUsername">@...</p>

                </div>

            </div>

            <div class="profile-bio" id="profileBio"></div>

            <div class="profile-meta">

                <span id="profileLocation" hidden>
                    <i data-lucide="map-pin"></i>
                    <span></span>
                </span>

                <span id="profileDate">
                    <i data-lucide="calendar-days"></i>
                    No FaceCrato
                </span>

                <span id="privacyLabel">
                    <i data-lucide="globe"></i>
                    Perfil público
                </span>

            </div>

            <div class="profile-actions" id="profileActions"></div>

        </div>

    </section>

    <div class="section-heading">
        <h2>Publicações</h2>

        <button class="btn" id="refreshButton">
            <i data-lucide="refresh-cw"></i>
            Atualizar
        </button>
    </div>

    <section class="posts-grid" id="postsContainer">
        <div class="panel loading">
            <div class="spinner"></div>
            Carregando publicações...
        </div>
    </section>

</main>

<nav class="mobile-nav">

    <button onclick="location.href='./feed.html'">
        <i data-lucide="house"></i>
        Feed
    </button>

    <button onclick="location.href='./amigos.html'">
        <i data-lucide="users"></i>
        Amigos
    </button>

    <button onclick="location.href='./notificacoes.html'">
        <i data-lucide="bell"></i>
        Alertas
    </button>

    <button>
        <i data-lucide="user-round"></i>
        Perfil
    </button>

</nav>

<!-- MODAL EDITAR PERFIL -->
<div class="modal-backdrop" id="editModal">

    <div class="modal">

        <h2>Editar perfil</h2>

        <form id="editForm">

            <div class="field">
                <label for="editName">Nome completo</label>
                <input id="editName" maxlength="100" required>
            </div>

            <div class="field">
                <label for="editUsername">Nome de usuário</label>
                <input id="editUsername" maxlength="30" required>
                <small style="color:#94a3b8;font-size:11px">
                    Letras minúsculas, números e underline.
                </small>
            </div>

            <div class="field">
                <label for="editBio">Biografia</label>
                <textarea id="editBio" maxlength="500" placeholder="Conte um pouco sobre você..."></textarea>
            </div>

            <div class="field">
                <label for="editCity">Cidade</label>
                <input id="editCity" maxlength="100">
            </div>

            <div class="field">
                <label for="editState">Estado (UF)</label>
                <input id="editState" maxlength="2" placeholder="CE">
            </div>

            <div class="modal-actions">
                <button type="button" class="btn" id="cancelEdit">Cancelar</button>
                <button type="submit" class="btn btn-primary" id="saveProfileButton">
                    Salvar alterações
                </button>
            </div>

        </form>

    </div>

</div>

<input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp" hidden>
<input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp" hidden>

<script type="module">

import { supabase } from "./supabase.js";

// =========================================
// ESTADO
// =========================================

const params = new URLSearchParams(location.search);
const requestedId = params.get("id");

let currentUser = null;
let currentProfile = null;
let profileId = null;
let isOwnProfile = false;
let friendship = null;

const postsContainer = document.getElementById("postsContainer");

// =========================================
// UTILITÁRIOS
// =========================================

function escapeHTML(value = "") {
    return String(value).replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    })[char]);
}

function initials(name = "F") {
    return name.trim().split(/\s+/).slice(0,2)
        .map(part => part[0] || "")
        .join("")
        .toUpperCase();
}

function notify(text, icon = "success") {
    Swal.fire({
        toast:true,
        position:"top",
        icon,
        title:text,
        showConfirmButton:false,
        timer:2400,
        background:"#111c2e",
        color:"#f8fafc"
    });
}

function errorMessage(text) {
    Swal.fire({
        icon:"error",
        title:"Não foi possível concluir",
        text,
        background:"#111c2e",
        color:"#f8fafc",
        confirmButtonColor:"#2563eb"
    });
}

function formatDate(value) {
    return new Intl.DateTimeFormat("pt-BR", {
        day:"2-digit",
        month:"long",
        year:"numeric"
    }).format(new Date(value));
}

// Converte caminho privado do Storage em URL temporária.
// Os campos avatar_url e cover_url devem guardar o caminho do objeto,
// não a URL assinada temporária.
async function storageUrl(bucket, path) {

    if (!path) return null;

    if (/^https?:\/\//i.test(path)) return path;

    const { data, error } = await supabase.storage
        .from(bucket)
        .createSignedUrl(path, 3600);

    if (error) {
        console.error("Erro ao gerar URL:", error);
        return null;
    }

    return data.signedUrl;

}

// =========================================
// CARREGAR PERFIL
// =========================================

async function initialize() {

    const { data, error } = await supabase.auth.getSession();

    if (error || !data.session) {
        location.replace("./login.html");
        return;
    }

    currentUser = data.session.user;

    profileId = requestedId || currentUser.id;
    isOwnProfile = profileId === currentUser.id;

    await loadProfile();

}

async function loadProfile() {

    const { data, error } = await supabase
        .from("profiles")
        .select(`
            id,
            username,
            full_name,
            bio,
            avatar_url,
            cover_url,
            city,
            state,
            is_private,
            created_at
        `)
        .eq("id", profileId)
        .maybeSingle();

    if (error) {
        console.error(error);
        throw error;
    }

    if (!data) {

        document.getElementById("profileName").textContent =
            "Perfil indisponível";

        document.getElementById("profileUsername").textContent =
            "Este perfil não está disponível para visualização.";

        postsContainer.innerHTML = `
            <div class="panel empty-state">
                <i data-lucide="user-round-x"></i>
                <strong>Perfil não encontrado</strong>
                <p>O perfil pode ser privado, removido ou indisponível.</p>
            </div>
        `;

        lucide.createIcons();
        return;

    }

    currentProfile = data;

    renderProfile();

    if (!isOwnProfile) {
        await loadFriendship();
    }

    await loadUserPosts();

}

// =========================================
// RENDERIZAR PERFIL
// =========================================

async function renderProfile() {

    const name = currentProfile.full_name || "Usuário";
    const username = currentProfile.username || "usuario";

    document.title = `${name} | FaceCrato`;

    document.getElementById("profileName").textContent = name;

    document.getElementById("profileUsername").textContent =
        "@" + username;

    document.getElementById("profileBio").textContent =
        currentProfile.bio || (
            isOwnProfile
                ? "Adicione uma biografia para contar um pouco sobre você."
                : ""
        );

    const locationText = [
        currentProfile.city,
        currentProfile.state
    ].filter(Boolean).join(" - ");

    const locationElement = document.getElementById("profileLocation");

    if (locationText) {
        locationElement.hidden = false;
        locationElement.querySelector("span").textContent = locationText;
    } else {
        locationElement.hidden = true;
    }

    document.getElementById("profileDate").innerHTML = `
        <i data-lucide="calendar-days"></i>
        No FaceCrato desde ${formatDate(currentProfile.created_at)}
    `;

    document.getElementById("privacyLabel").innerHTML =
        currentProfile.is_private
            ? '<i data-lucide="lock"></i> Perfil privado'
            : '<i data-lucide="globe"></i> Perfil público';

    const avatar = await storageUrl("avatars", currentProfile.avatar_url);
    const cover = await storageUrl("covers", currentProfile.cover_url);

    const avatarImage = document.getElementById("avatarImage");
    const avatarPlaceholder = document.getElementById("avatarPlaceholder");

    if (avatar) {
        avatarImage.src = avatar;
        avatarImage.hidden = false;
        avatarPlaceholder.hidden = true;
    } else {
        avatarImage.hidden = true;
        avatarPlaceholder.hidden = false;
        avatarPlaceholder.textContent = initials(name);
    }

    if (cover) {
        document.getElementById("cover").style.backgroundImage =
            `url("${cover.replace(/"/g, "%22")}")`;
    }

    if (isOwnProfile) {

        document.getElementById("changeAvatarButton").hidden = false;
        document.getElementById("changeCoverButton").hidden = false;

        document.getElementById("profileActions").innerHTML = `
